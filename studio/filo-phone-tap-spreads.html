<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio · Filo step 4: swatch spreads</title>
<style>
  body { margin: 0; background: #fff; font: 14px/1.5 system-ui, sans-serif; color: #232323; }
  main { width: min(100%, 1480px); margin: 0 auto; padding: 40px 24px 64px; box-sizing: border-box; }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  main > p { margin: 0 0 32px; color: #6f6f71; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 40px 32px; }
  figure { margin: 0; }
  /* The full stage: the 900 scene plus the 100px the phone rises out of. */
  .frame { aspect-ratio: 1440 / 1000; background: #f5f5f4; border-radius: 10px; overflow: hidden; }
  .frame iframe { display: block; width: 100%; height: 100%; border: 0; }
  figcaption { margin-top: 10px; color: #6f6f71; }
  figcaption b { color: #141414; font-weight: 600; margin-right: 6px; }
  figcaption code { font: 12px ui-monospace, monospace; color: #9a9a9d; margin-left: 6px; }
</style>
</head>
<body>
<main>
  <h1>Step 4: how the swatches spread around the phone</h1>
  <p>Each is the full loop with a different deal. Every swatch is the same size; in every spread the sheer sits under its neighbours, so less of it shows. Scatter is the case study's default.</p>
  <div class="grid" id="grid"></div>
</main>
<script type="module">
const SPREADS = [
  ['scatter', 'Loose and even: three down the left with the sheer in the middle, two staggered on the right.'],
  ['orbit', 'A ring around the phone, each swatch turned along it.'],
  ['clusters', 'Two piles, one each side, overlapping like a sorted sample bundle.'],
  ['tossed', 'Dropped on the table: bigger turns and uneven heights.'],
  ['cascade', 'A diagonal from the top left to the bottom right, through the phone.'],
]
const grid = document.getElementById('grid')
const frames = SPREADS.map(([name, about]) => {
  const fig = document.createElement('figure')
  fig.innerHTML = `<div class="frame"><iframe src="/work/filo/filo-phone-tap.html?spread=${name}" title="Swatch spread: ${name}"></iframe></div>
    <figcaption><b>${name[0].toUpperCase() + name.slice(1)}</b>${about}<code>?spread=${name}</code></figcaption>`
  grid.append(fig)
  return fig.querySelector('iframe')
})
// Embedded prototypes wait for the host's play.
addEventListener('message', ({ source, data }) => {
  const frame = frames.find(f => f.contentWindow === source)
  if (frame && data?.filoAppFlow === 'ready') source.postMessage({ filoAppFlow: 'play' }, location.origin)
})
</script>
</body>
</html>
