<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Momo — Watch to iPhone check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<style>
  @font-face { font-family: 'Beatrice'; src: url('/fonts/Beatrice-Regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Beatrice'; src: url('/fonts/Beatrice-Medium.woff2') format('woff2'); font-weight: 500; }
  /* Momo prototype serif (Watch note direction). Dev-only copy from reself-voice-prototypes. */
  @font-face { font-family: 'Test Family'; src: url('/studio/fonts/TestFamily-Regular.otf') format('opentype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Test Family'; src: url('/studio/fonts/TestFamily-Italic.otf') format('opentype'); font-weight: 400; font-style: italic; }
  :root {
    --ink: #171717; --stone: #6f6b68; --paper: #f2f2f2;
    --accent: #4f9cf9; --tt: 700ms;
    --font: 'Beatrice', system-ui, sans-serif;
    --screen-font: Inter, -apple-system, system-ui, sans-serif;
    --serif: 'Test Family', Georgia, serif;
    --s-ink: #1f2a2e; --s-mute: #6b7780; --s-line: rgb(20 40 48 / 0.08);
    --soft: color-mix(in oklab, var(--accent) 12%, white);
    --soft-2: color-mix(in oklab, var(--accent) 24%, white);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); letter-spacing: -0.02em; display: grid; grid-template-columns: 1fr 380px; min-height: 100vh; }
  button, input, select, textarea { font: inherit; font-size: 13px; }
  button { border: 1px solid var(--ink); background: none; border-radius: 999px; padding: 5px 12px; cursor: pointer; color: var(--ink); }
  button.primary { background: var(--ink); color: #fff; }

  /* ---------- Stage: a 1440×800 page scaled to fit ---------- */
  .stage { display: grid; grid-template-rows: 1fr auto; padding: 24px 32px; gap: 16px; height: 100vh; position: sticky; top: 0; }
  .viewport { position: relative; min-height: 0; overflow: hidden; }
  .page { position: absolute; left: 50%; top: 50%; width: 1440px; height: 800px; transform: translate(-50%, -50%) scale(var(--fit, .6)); overflow: clip; border-radius: 18px; }
  .stage[data-view='page'] .page { background: #f5f5f5; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 20px 60px rgba(0,0,0,.08); }
  .heading { position: absolute; left: 0; right: 0; top: 64px; text-align: center; display: none; }
  .stage[data-view='page'] .heading { display: block; }
  .heading small { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #8a8683; margin-bottom: 14px; }
  .heading h2 { margin: 0 auto; max-width: 760px; font-weight: 400; font-size: 40px; line-height: 1.05; letter-spacing: -0.035em; }
  .devices { position: absolute; left: 0; right: 0; top: 50%; display: flex; justify-content: center; align-items: center; transform: translateY(-50%) scale(var(--dev-scale, 1.1)); }
  .stage[data-view='page'] .devices { top: auto; bottom: 16px; transform-origin: bottom center; transform: translateY(var(--fold, 0%)) scale(calc(var(--dev-scale, 1.1) * .76)); }
  .stage[data-view='compare'] .devices { display: none; }
  .caption { text-align: center; min-height: 48px; }
  .caption b { display: block; font-weight: 500; font-size: 18px; }
  .caption span { color: var(--stone); font-size: 14px; }
  .timeline { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .timeline button { font-size: 12px; border-color: #ccc; display: inline-flex; gap: 8px; align-items: center; }
  .timeline button i { font-style: normal; color: #999; font-size: 11px; }
  .timeline button[aria-current='true'] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .timeline button[aria-current='true'] i { color: #bbb; }
  .progress { height: 2px; background: #ddd; border-radius: 2px; max-width: 520px; margin: 10px auto 0; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); }
  .transport { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }

  /* ---------- Compare: every Watch direction, its three steps stacked ---------- */
  .compare { position: absolute; inset: 22px 24px 16px; display: none; grid-template-columns: repeat(5, 1fr); align-content: center; gap: 6px 10px; }
  .stage[data-view='compare'] .compare { display: grid; }
  .compare__item { display: grid; justify-items: center; align-content: start; gap: 8px; padding: 14px 6px 12px; border-radius: 22px; border: 1px solid transparent; background: none; cursor: pointer; text-align: center; }
  .compare__item[aria-pressed='true'] { border-color: #d6d3d0; background: rgba(255,255,255,.55); }
  .compare__stack { display: grid; gap: 10px; zoom: .74; }
  .face { position: relative; width: calc(396px * 260 / 540); height: calc(479px * 260 / 540); border-radius: 22% / 18%; background: #000; overflow: hidden; color: #fff; font: 11px/1.3 var(--screen-font); letter-spacing: -0.01em; text-align: center; box-shadow: 0 0 0 5px #1b1b1d, 0 0 0 7px #d9d4cc, 0 10px 22px -8px rgb(0 0 0 / .35); }
  .compare__item > b { font-weight: 500; font-size: 15px; }
  .compare__item > span { color: var(--stone); font-size: 11.5px; max-width: 250px; text-align: center; line-height: 1.3; }

  /* Device screens use device type, never the portfolio's Beatrice. */
  .watch__screen, .phone__screen { font-family: var(--screen-font); letter-spacing: -0.01em; }

  /* ---------- Watch: Starlight mockup (540×860, screen x72 y193, 396×479) ---------- */
  .watch { --k: calc(260 / 540); position: relative; z-index: 2; width: 260px; height: calc(860px * var(--k)); filter: drop-shadow(0 18px 30px rgba(0,0,0,.14)); flex-shrink: 0; }
  .watch__img { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
  .watch__screen { position: absolute; z-index: 1; left: calc(72px * var(--k)); top: calc(193px * var(--k)); width: calc(396px * var(--k)); height: calc(479px * var(--k)); border-radius: 22% / 18%; background: #000; overflow: hidden; color: #fff; font-size: 11px; line-height: 1.3; }

  /* ---------- Phone: iPhone Silver mockup (874×1780, screen x46 y39, 784×1702) ---------- */
  .phone { --k: calc(300 / 874); position: relative; z-index: 2; width: 300px; height: calc(1780px * var(--k)); filter: drop-shadow(0 24px 40px rgba(0,0,0,.16)); flex-shrink: 0; }
  .phone__img { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  .phone__screen { position: absolute; z-index: 1; left: calc(46px * var(--k)); top: calc(39px * var(--k)); width: calc(784px * var(--k)); height: calc(1702px * var(--k)); border-radius: calc(113px * var(--k)); overflow: hidden; background: #000; font-size: 11px; isolation: isolate; color: var(--s-ink); }
  /* The mockup's screen hole has tighter corners than the screen's radius; a black backing under the frame fills the slivers. */
  .phone::before { content: ''; position: absolute; z-index: 0; left: calc(40px * var(--k)); top: calc(33px * var(--k)); width: calc(794px * var(--k)); height: calc(1714px * var(--k)); border-radius: calc(120px * var(--k)); background: #000; }

  /* ---------- Connection between the devices: five styles, picked by .link[data-style] ---------- */
  .link { position: relative; z-index: 1; width: var(--dev-gap, 150px); height: 120px; flex-shrink: 0; }
  .link > * { opacity: 0; transition: opacity .6s ease; }
  .link svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .link .track { fill: none; stroke: #c9c6c3; stroke-width: 1.5; stroke-dasharray: 2 7; stroke-linecap: round; transition: stroke .6s ease; }
  .link .flow { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 7; stroke-linecap: round; opacity: 0; transition: opacity .6s ease; }
  .link[data-state='send'] .flow { opacity: 1; animation: march 0.9s linear infinite; }
  .link[data-state='nudge'] .track { stroke: color-mix(in oklab, var(--accent) 55%, #ccc); }
  @keyframes march { to { stroke-dashoffset: -18; } }
  /* 1 · Data chips: one labelled chip at a time, never overlapping */
  .link[data-style='packets'] :is(.path, .packet), .link[data-style='comet'] :is(.path, .comet) { opacity: 1; }
  .packet { position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px 5px 7px; border-radius: 999px; background: #fff; color: var(--s-ink); font: 500 11px/1 var(--screen-font); white-space: nowrap; box-shadow: 0 0 0 .5px rgb(20 40 48 / .1), 0 8px 18px -8px rgb(0 30 50 / .35); offset-path: path('M 0 70 C 50 10, 100 10, 150 70'); offset-rotate: 0deg; offset-distance: 0%; translate: -50% -50%; visibility: hidden; }
  .packet svg { color: var(--accent); }
  .link[data-style='packets'][data-state='send'] .packet { animation: travel 1.1s cubic-bezier(.45,.05,.35,1) both; }
  .link[data-style='packets'][data-state='send'] .packet:nth-of-type(2) { animation-delay: 1.05s; }
  .link[data-style='packets'][data-state='send'] .packet:nth-of-type(3) { animation-delay: 2.1s; }
  @keyframes travel { 0% { visibility: visible; offset-distance: 12%; opacity: 0; scale: .8; } 20%, 80% { opacity: 1; scale: 1; } 100% { visibility: visible; offset-distance: 88%; opacity: 0; scale: .8; } }
  /* 2 · Braided wave: the intro's braid band spans the gap */
  .link-braid { position: absolute; left: -14px; top: 28px; height: 64px; width: calc(100% + 28px); }
  .link[data-style='braid'] .link-braid { opacity: 1; }
  .braid { display: block; width: 100%; height: 100%; }
  /* 3 · Signal comet: glowing dots ride the arc */
  .comet { position: absolute; left: 0; top: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 22%, transparent), 0 0 18px 4px color-mix(in oklab, var(--accent) 60%, transparent); offset-path: path('M 0 70 C 50 10, 100 10, 150 70'); offset-rotate: 0deg; translate: -50% -50%; visibility: hidden; }
  .link[data-style='comet'][data-state='send'] .comet { animation: comet 1.2s cubic-bezier(.5,0,.5,1) infinite; }
  .link[data-style='comet'][data-state='send'] .comet:nth-of-type(2) { animation-delay: .4s; }
  .link[data-style='comet'][data-state='send'] .comet:nth-of-type(3) { animation-delay: .8s; }
  @keyframes comet { 0% { visibility: visible; offset-distance: 4%; opacity: 0; scale: .5; } 25%, 75% { opacity: 1; scale: 1; } 100% { visibility: visible; offset-distance: 96%; opacity: 0; scale: .5; } }
  /* 4 · Heartbeat trace: an ECG line draws across */
  .link[data-style='trace'] .trace { opacity: 1; }
  /* At mid height the Watch PNG has 16px of transparent margin right of the case, the phone 2.4px left of its frame:
     the trace runs under both devices so its ends meet the hardware. */
  .link svg.trace { left: -20px; width: calc(100% + 26px); }
  .trace path { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .trace__base { stroke: #d4d1ce; }
  .trace__live { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 30 130; stroke-dashoffset: 30; opacity: 0; }
  .link[data-state='send'] .trace__live { opacity: 1; animation: trace 1.15s linear infinite; }
  .link[data-state='nudge'] .trace__live { opacity: 1; stroke-dasharray: 100 0; stroke-dashoffset: 0; }
  @keyframes trace { from { stroke-dashoffset: 30; } to { stroke-dashoffset: -100; } }
  /* 5 · Ripples: AirDrop-style arcs radiate from the Watch side */
  .ripple { position: absolute; top: 60px; width: 26px; border-radius: 50%; border: 2.4px solid transparent; border-right-color: var(--accent); translate: 0 -50%; }
  .ripple:nth-of-type(1) { left: 8%; height: 34px; }
  .ripple:nth-of-type(2) { left: 30%; height: 58px; }
  .ripple:nth-of-type(3) { left: 52%; height: 82px; }
  .link[data-style='ripples'] .ripple { opacity: .22; }
  .link[data-style='ripples'][data-state='nudge'] .ripple { opacity: .7; }
  .link[data-style='ripples'][data-state='send'] .ripple { animation: ripple 1.2s ease-in-out infinite; }
  .link[data-style='ripples'][data-state='send'] .ripple:nth-of-type(2) { animation-delay: .2s; }
  .link[data-style='ripples'][data-state='send'] .ripple:nth-of-type(3) { animation-delay: .4s; }
  @keyframes ripple { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }

  /* ---------- Screens + transitions ---------- */
  .screen { position: absolute; inset: 0; }
  .screen.entering { z-index: 1; animation: screenIn var(--tt) cubic-bezier(.2,.8,.2,1) both; }
  .screen.leaving { z-index: 0; pointer-events: none; animation: screenOut var(--tt) ease both; }
  @keyframes screenIn { from { opacity: 0; filter: blur(8px); transform: translateY(10px) scale(.985); } }
  @keyframes screenOut { to { opacity: 0; filter: blur(6px); } }
  .rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 110ms + 150ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes fadeIn { from { opacity: 0; } }

  /* ---------- Watch parts ---------- */
  .w { position: relative; padding: 30px 14px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; height: 100%; }
  .w-center { justify-content: center; padding-top: 22px; }
  .w-time { position: absolute; top: 13px; right: 20px; font-size: 11px; font-weight: 600; color: #fff; }
  .w-time.left { right: auto; left: 22px; color: var(--accent); }
  .w-title { font-weight: 600; font-size: 14px; line-height: 1.15; margin-top: 6px; text-wrap: balance; }
  .w-body { color: #b0b0b5; font-size: 10.5px; margin-top: 3px; line-height: 1.3; text-wrap: balance; }
  .w-chip { display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; padding: 5px 9px; border-radius: 999px; background: #1c1c1e; font-size: 10.5px; color: #e5e5ea; }
  .w-chip svg { color: var(--accent); }
  .w-hr { width: 100%; height: 40px; margin-top: 8px; overflow: visible; }
  .w-hr path { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.6s .2s cubic-bezier(.5,0,.2,1) forwards; }
  .w-hr circle { fill: #fff; stroke: var(--accent); stroke-width: 2; opacity: 0; animation: fadeIn .4s 1.4s forwards, beat 1.1s 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes beat { 50% { scale: 1.35; } }
  .w-stats { display: flex; gap: 22px; margin-top: 6px; }
  .w-stats div { display: grid; justify-items: center; }
  .w-stats b { font-size: 20px; font-weight: 600; line-height: 1; }
  .w-stats small { font-size: 9px; color: #8e8e93; margin-top: 2px; }
  /* A · Pulse line */
  .wa-slip { width: 100%; animation: slip 2.6s .5s cubic-bezier(.6,0,.4,1) both; }
  @keyframes slip { 60%, 100% { translate: 130% 0; opacity: 0; } }
  .wa-slip .w-hr path { animation: none; stroke-dashoffset: 0; }
  .wa-slip .w-hr circle { opacity: 1; animation: beat 1.1s ease-in-out infinite; }
  .wa-bar { width: 70%; height: 4px; border-radius: 4px; background: #2a2a2c; margin-top: auto; overflow: hidden; }
  .wa-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; animation: barFill 2.6s .3s cubic-bezier(.5,0,.2,1) forwards; }
  @keyframes barFill { to { width: 100%; } }
  .wa-done { position: relative; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: #1c1c1e; color: #fff; animation: pop .6s cubic-bezier(.3,1.4,.5,1) both; }
  .wa-done i { position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); border: 2px solid #000; }
  @keyframes pop { from { scale: .5; opacity: 0; } }
  /* B · Momo companion */
  .wb-momo { position: relative; width: 64px; height: 64px; }
  .wb-momo img { width: 100%; height: 100%; object-fit: contain; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 -4px; } }
  .wb-heart { position: absolute; right: -4px; top: 2px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #ff6b81; color: #fff; animation: beat .55s ease-in-out infinite; }
  .wb-momo--sm { width: 46px; height: 46px; margin-top: 4px; }
  .wb-momo--sm .wb-heart { width: 16px; height: 16px; right: -5px; top: 0; }
  .wb-signals { display: grid; gap: 4px; margin-top: 8px; text-align: left; }
  .wb-signals div { display: flex; gap: 6px; align-items: center; font-size: 10.5px; color: #c7c7cc; white-space: nowrap; animation: fadeIn .5s both; animation-delay: calc(var(--i) * 450ms + 400ms); }
  .wb-signals svg { color: var(--accent); flex-shrink: 0; }
  .wb-signals div:first-child svg { color: #ff6b81; }
  .wb-fly img { animation: fly 2.8s .3s cubic-bezier(.6,0,.3,1) both; }
  @keyframes fly { 45% { translate: 0 -6px; scale: 1.05; } 100% { translate: 160% -30%; scale: .5; opacity: 0; } }
  .wb-trail { display: flex; gap: 5px; margin: -8px 0 4px; }
  .wb-trail i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); animation: fadeIn .5s both alternate infinite; }
  .wb-trail i:nth-child(2) { animation-delay: .25s; } .wb-trail i:nth-child(3) { animation-delay: .5s; }
  .wb-bubble { position: relative; background: #1c1c1e; border-radius: 16px; padding: 9px 11px; font-size: 12px; line-height: 1.25; color: #fff; text-align: left; text-wrap: pretty; animation: rise .6s .2s both; }
  .wb-bubble::after { content: ''; position: absolute; left: 22px; bottom: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #1c1c1e; }
  .wb-small { width: 40px; height: 40px; object-fit: contain; align-self: flex-start; margin: 8px 0 0 8px; animation: bob 3s ease-in-out infinite; }
  /* C · Breath rings */
  .wc-rings { position: relative; width: 86px; height: 86px; display: grid; place-items: center; }
  .wc-rings i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: .5; }
  .wc-rings i:nth-child(2) { inset: 12px; opacity: .7; } .wc-rings i:nth-child(3) { inset: 24px; opacity: 1; background: color-mix(in oklab, var(--accent) 22%, #000); }
  .wc-rings b { position: relative; display: grid; justify-items: center; font-size: 17px; font-weight: 600; line-height: 1; color: #fff; }
  .wc-rings b small { font-size: 8px; color: #b0b0b5; margin-top: 2px; }
  .wc-rings img { width: 30px; height: 30px; object-fit: contain; }
  .wc-rings[data-mode='beat'] i { animation: ringBeat .62s ease-in-out infinite; }
  .wc-rings[data-mode='beat'] i:nth-child(2) { animation-delay: .06s; } .wc-rings[data-mode='beat'] i:nth-child(1) { animation-delay: .12s; }
  @keyframes ringBeat { 30% { scale: 1.08; } }
  .wc-rings[data-mode='out'] i:not(:nth-child(3)) { animation: ringOut 1.4s cubic-bezier(.2,.6,.3,1) infinite; }
  .wc-rings[data-mode='out'] i:nth-child(2) { animation-delay: .7s; }
  @keyframes ringOut { from { scale: .6; opacity: 1; } to { scale: 1.5; opacity: 0; } }
  .wc-rings[data-mode='breathe'] i { animation: ringBreathe 4s ease-in-out infinite; }
  @keyframes ringBreathe { 50% { scale: 1.12; opacity: .3; } }
  /* D · Braided wave */
  .wd-braid { width: calc(100% + 28px); height: 66px; margin: 0 -14px; }
  /* E · Serif note */
  .we { align-items: flex-start; text-align: left; justify-content: flex-end; padding: 30px 16px 16px; }
  .we p { margin: 0; font-family: var(--serif); font-size: 21px; line-height: 1.08; letter-spacing: -0.01em; color: #fff; text-wrap: pretty; animation: rise .7s .15s both; }
  .we-meta { display: flex; gap: 5px; align-items: center; margin-top: 8px; font-size: 10px; color: #8e8e93; }
  .we-meta svg { color: #ff6b81; }
  .we-dots { display: flex; gap: 5px; margin-top: 10px; }
  .we-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: fadeIn .6s ease-in-out infinite alternate; }
  .we-dots i:nth-child(2) { animation-delay: .2s; } .we-dots i:nth-child(3) { animation-delay: .4s; }

  /* Lock screen = the case study's flows/lockscreen.webp (same 874×1780 mockup as .phone), laid over the whole device
     so the screen clips it to the exact pixels. .lock__* copies CaseStudyPage.css; cqw are of the full mockup, as there. */
  .p-lock { position: absolute; left: calc(-46px * var(--k)); top: calc(-39px * var(--k)); width: calc(874px * var(--k)); height: calc(1780px * var(--k)); container-type: inline-size; }
  .p-lock__bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .p-lock::after { content: ''; position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  .p-lock[data-dim]::after { opacity: .62; }
  .lock__note { position: absolute; left: 8.15%; right: 8.15%; top: 36%; display: grid; grid-template-columns: 7.8cqw 1fr; column-gap: 2.7cqw; padding: 3.3cqw 3.5cqw 3.4cqw 2.7cqw; border-radius: 5cqw; background: rgb(245 245 247 / .62); -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4); color: #111; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 3.6cqw; line-height: 1.25; letter-spacing: -0.01em; animation: note-in .7s .3s cubic-bezier(.22,1,.36,1) both; }
  @keyframes note-in { from { opacity: 0; translate: 0 -24px; scale: .96; } }
  .lock__icon { grid-row: 1 / 3; width: 7.8cqw; height: 7.8cqw; border-radius: 1.75cqw; background: #eaf5ff url('/work/unwind/intro/momo-open.webp') var(--momo-x, 50%) var(--momo-y, 72%) / var(--momo-size, 96%) no-repeat; }
  .lock__row { display: flex; align-items: baseline; gap: 1.5cqw; }
  .lock__app { font-weight: 600; color: rgb(17 17 17 / .55); }
  .lock__time { margin-left: auto; color: rgb(17 17 17 / .45); }
  .lock__copy { grid-column: 2; }
  .lock__title { margin: .15cqw 0 0; font-size: 4.05cqw; font-weight: 600; }
  .lock__text { margin: .2cqw 0 0; }
  /* Nudge timeline (step ms 3600): note in .3s → buttons open 1.4s → touch arrives 2.4s → press ≈2.95s → fades by 3.6s, when the sequence restarts. */
  .lock__actions { grid-column: 1 / -1; display: grid; gap: 1.6cqw; max-height: 0; margin-top: 0; overflow: hidden; animation: note-open .6s 1.4s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes note-open { to { max-height: 30cqw; margin-top: 3cqw; } }
  .lock__actions span { position: relative; padding: 2.4cqw; border-radius: 3.6cqw; background: rgb(255 255 255 / .7); text-align: center; font-weight: 500; }
  .lock__actions span:first-child { color: #0a7bd6; animation: note-tap .5s 2.7s ease both; }
  @keyframes note-tap { 50% { background: #fff; scale: .97; } }
  /* Simulator-style touch: a translucent circle glides onto "Yes", presses with the button, then lifts away. */
  .lock__cursor { position: absolute; left: 50%; top: 50%; width: 8cqw; height: 8cqw; margin: -4cqw 0 0 -4cqw; border-radius: 50%; background: rgb(30 34 44 / .22); box-shadow: inset 0 0 0 .3cqw rgb(255 255 255 / .55), 0 1cqw 3cqw rgb(0 0 0 / .12); pointer-events: none; opacity: 0; animation: cursor-tap 1.2s 2.4s cubic-bezier(.3,.7,.3,1) both; }
  @keyframes cursor-tap {
    0% { opacity: 0; translate: 10cqw 6cqw; scale: 1; }
    35% { opacity: 1; translate: 0 0; scale: 1; }
    45% { scale: .78; background: rgb(30 34 44 / .32); }
    58% { opacity: 1; scale: 1; }
    100% { opacity: 0; translate: 0 0; scale: 1.15; }
  }

  /* ---------- Panel ---------- */
  aside { border-left: 1px solid #e2e0de; background: #fafafa; padding: 22px 22px 40px; display: grid; gap: 22px; align-content: start; }
  aside h2 { margin: 0 0 10px; font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--stone); }
  .designs { display: grid; gap: 6px; }
  .designs button { text-align: left; border-radius: 14px; border-color: #ddd; padding: 9px 12px; display: grid; gap: 2px; }
  .designs button span { color: var(--stone); font-size: 12px; line-height: 1.3; }
  .designs button[aria-pressed='true'] { border-color: var(--ink); background: #fff; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets button[aria-pressed='true'] { background: var(--ink); color: #fff; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: grid; gap: 4px; font-size: 12px; color: var(--stone); }
  .field.wide { grid-column: span 2; }
  .field input, .field select, .field textarea { border: 1px solid #ddd; border-radius: 8px; padding: 6px 8px; background: #fff; color: var(--ink); }
  .field input[type='range'] { padding: 0; }
  .field input[type='color'] { padding: 2px; height: 32px; }
  .steps { display: grid; gap: 10px; }
  .step { border: 1px solid #e2e0de; border-radius: 14px; padding: 10px; display: grid; gap: 6px; background: #fff; }
  .step[data-on] { border-color: var(--ink); }
  .step header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--stone); }
  .step input, .step textarea { width: 100%; border: 1px solid #eee; border-radius: 8px; padding: 6px 8px; }
  .step textarea { resize: vertical; min-height: 44px; font-size: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--stone); margin: 8px 0 0; line-height: 1.4; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<section class="stage" id="stage" data-view="devices">
  <div class="viewport" id="viewport">
    <div class="page" id="pageFrame">
      <div class="heading"><small id="eyebrow">Apple Watch + iPhone</small><h2 id="headingTitle">Your Watch notices. Momo checks in.</h2></div>
      <div class="devices" id="devices">
        <div class="watch">
          <div class="watch__screen" id="watchScreen"></div>
          <img class="watch__img" src="/work/unwind/devices/watch-starlight.png" alt="" />
        </div>
        <div class="link" id="link"></div>
        <div class="phone">
          <div class="phone__screen" id="phoneScreen"></div>
          <img class="phone__img" src="/work/unwind/devices/iphone-silver.png" alt="" />
        </div>
      </div>
      <div class="compare" id="compare"></div>
    </div>
  </div>
  <div>
    <div class="caption" id="caption"></div>
    <div class="timeline" id="timeline"></div>
    <div class="progress"><i id="progress"></i></div>
    <div class="transport">
      <button id="prev">← Prev</button>
      <button id="replay">↻ Replay step</button>
      <button id="play" class="primary">Play</button>
      <button id="next">Next →</button>
    </div>
  </div>
</section>

<aside>
  <div>
    <h2>Watch direction</h2>
    <div class="designs" id="designs"></div>
  </div>
  <div>
    <h2>Connection style</h2>
    <div class="designs" id="links"></div>
  </div>
  <div>
    <h2>Presentation</h2>
    <div class="presets" id="viewPick">
      <button data-view="devices">Devices only</button>
      <button data-view="page">In page context</button>
      <button data-view="compare">Compare all</button>
    </div>
    <div class="fields" style="margin-top:12px">
      <label class="field">Accent<input type="color" data-set="accent" /></label>
      <label class="field wide">Notification Momo · X <input type="range" min="-100" max="200" step="1" data-set="momoX" /></label>
      <label class="field wide">Notification Momo · Y <input type="range" min="-100" max="300" step="1" data-set="momoY" /></label>
      <label class="field wide">Notification Momo · scale <input type="range" min="50" max="180" step="1" data-set="momoScale" /></label>
      <label class="field">Screen transition (ms)<input type="number" min="0" step="50" data-set="transitionMs" /></label>
      <label class="field wide">Device size <input type="range" min="0.6" max="1.4" step="0.01" data-set="scale" /></label>
      <label class="field wide">Gap between devices <input type="range" min="60" max="260" step="1" data-set="gap" /></label>
      <label class="field wide">Cut by the fold (page view) <input type="range" min="0" max="0.5" step="0.01" data-set="fold" /></label>
      <label class="field wide" style="flex-direction:row"><span><input type="checkbox" data-set="loop" /> Loop when playing</span></label>
    </div>
  </div>
  <div>
    <h2>Sequence · 3 steps</h2>
    <div class="steps" id="steps"></div>
  </div>
  <div>
    <h2>Save</h2>
    <div class="row">
      <button id="export">Copy JSON</button>
      <button id="import">Paste JSON</button>
      <button id="reset">Reset to default</button>
    </div>
    <p class="hint" id="saveState">Changes save in this browser.</p>
  </div>
</aside>

<script type="module" src="/studio/unwind-insights-sequence.js"></script>
</body>
</html>
