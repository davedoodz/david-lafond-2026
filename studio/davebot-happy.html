<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Davebot — happy hover lab</title>
<style>
  :root {
    --ink-900: #171717;
    --shell: #d9d9d9;
    --size: 260px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(120% 90% at 50% 40%, #222 0%, #0c0c0c 70%);
    color: #f6f6f6;
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    width: var(--size);
    height: var(--size);
    touch-action: manipulation;
  }
  .bot {
    position: absolute;
    inset: 0;
    transform-origin: 50% 80%;
    will-change: transform;
  }
  .bot svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .shell { fill: var(--shell); cursor: pointer; }
  .pupil { fill: var(--ink-900); }
  .happy-eye {
    fill: none;
    stroke: var(--ink-900);
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sparkles { position: absolute; inset: 0; pointer-events: none; }
  .sparkle {
    position: absolute;
    left: 0;
    top: 0;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    opacity: 0;
    will-change: transform, opacity;
  }
  .sparkle svg { width: 100%; height: 100%; display: block; }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 28px;
    translate: -50% 0;
    color: rgb(255 255 255 / 0.4);
  }

  /* ---------- Controls ---------- */
  .panel {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 272px;
    max-height: calc(100vh - 32px);
    overflow: auto;
    padding: 14px 14px 12px;
    border: 1px solid rgb(255 255 255 / 0.12);
    border-radius: 14px;
    background: rgb(20 20 20 / 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    scrollbar-width: thin;
  }
  .section + .section { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgb(255 255 255 / 0.08); }
  .section h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgb(255 255 255 / 0.5);
  }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .presets button, .actions button {
    padding: 5px 10px;
    border: 1px solid rgb(255 255 255 / 0.16);
    border-radius: 999px;
    background: transparent;
    color: #f6f6f6;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background-color 160ms ease, color 160ms ease;
  }
  .presets button[aria-pressed='true'] { background: #f6f6f6; color: #171717; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; margin-bottom: 7px; }
  .row label { color: rgb(255 255 255 / 0.75); }
  .row output { font-variant-numeric: tabular-nums; color: rgb(255 255 255 / 0.5); }
  .row input[type='range'] { grid-column: 1 / -1; width: 100%; accent-color: #f6f6f6; margin: 0; }
  .row input[type='color'] { width: 28px; height: 20px; padding: 0; border: 0; background: none; cursor: pointer; }
  .actions { display: flex; gap: 6px; margin-top: 12px; }
  .panel-toggle {
    position: fixed; top: 16px; right: 16px; display: none;
    padding: 8px 12px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 0.16);
    background: rgb(20 20 20 / 0.82); color: #f6f6f6; font: inherit;
  }
  @media (max-width: 700px) {
    :root { --size: 200px; }
    .panel { top: auto; bottom: 16px; left: 16px; right: 16px; width: auto; max-height: 45vh; }
    .panel.is-hidden { display: none; }
    .panel-toggle { display: block; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="bot" id="bot">
      <svg viewBox="0 0 32 32" aria-label="Davebot">
        <defs>
          <clipPath id="head"><path d="M4 14.2a12 12.2 0 1 0 24 0a12 12.2 0 1 0 -24 0Z" /></clipPath>
          <radialGradient id="blushFill">
            <stop offset="0" stop-color="var(--blush, #ff9fb4)" stop-opacity="1" />
            <stop id="blushEdge" offset="1" stop-color="var(--blush, #ff9fb4)" stop-opacity="0" />
          </radialGradient>
        </defs>
        <path id="shell" class="shell"
          d="M16 2c7 0 12 5.1 12 12.4 0 4-1 6.4-1 9.2 0 2.2-1.4 3.6-3.2 3.6-1.7 0-2.6-1.1-3.6-1.1s-1.9 1.2-4.2 1.2-3.2-1.2-4.2-1.2-1.9 1.1-3.6 1.1C6.4 27.2 5 25.8 5 23.6c0-2.8-1-5.2-1-9.2C4 7.1 9 2 16 2Z" />
        <g style="pointer-events:none" clip-path="url(#head)">
          <ellipse id="blushL" fill="url(#blushFill)" opacity="0" />
          <ellipse id="blushR" fill="url(#blushFill)" opacity="0" />
          <!-- Resting eyes: ovals that follow the pointer and squint shut. -->
          <path id="eyeL" class="pupil" d="M9.6 13.4a2.5 3.1 0 1 0 5 0a2.5 3.1 0 1 0 -5 0Z" style="transform-box: fill-box; transform-origin: 50% 70%" />
          <path id="eyeR" class="pupil" d="M17.8 13.4a2.5 3.1 0 1 0 5 0a2.5 3.1 0 1 0 -5 0Z" style="transform-box: fill-box; transform-origin: 50% 70%" />
          <!-- Happy eyes: ^ ^ arcs that rise out of the squint. -->
          <path id="happyL" class="happy-eye" pathLength="1" stroke-dasharray="1 1" />
          <path id="happyR" class="happy-eye" pathLength="1" stroke-dasharray="1 1" />
        </g>
      </svg>
    </div>
    <div class="sparkles" id="sparkles"></div>
  </div>

  <p class="hint">Hover Davebot's body</p>

  <button class="panel-toggle" id="panelToggle" type="button">Controls</button>
  <aside class="panel" id="panel"></aside>

<script>
(() => {
  const $ = (id) => document.getElementById(id)
  const stage = $('stage'), bot = $('bot'), shell = $('shell'), sparkLayer = $('sparkles')
  const eyeL = $('eyeL'), eyeR = $('eyeR'), happyL = $('happyL'), happyR = $('happyR')
  const blushL = $('blushL'), blushR = $('blushR'), blushEdge = $('blushEdge')
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches

  // ---------- Dials, grouped. Each group has its own sub-presets. ----------
  const GROUPS = {
    feel: {
      title: 'Feel',
      dials: {
        inTime:   { label: 'Ease in (s)',        min: 0.1, max: 1.5, step: 0.01 },
        outTime:  { label: 'Ease out (s)',       min: 0.1, max: 2, step: 0.01 },
        lift:     { label: 'Lift when happy (%)', min: 0, max: 6, step: 0.1 },
        swell:    { label: 'Swell when happy',   min: 0, max: 0.08, step: 0.002 },
        tilt:     { label: 'Happy sway (deg)',   min: 0, max: 5, step: 0.1 },
        float:    { label: 'Idle float (%)',     min: 0, max: 4, step: 0.1 },
        size:     { label: 'Size (px)',          min: 120, max: 420, step: 1 },
      },
      presets: {
        calm:   { inTime: 0.45, outTime: 0.7, lift: 1.6, swell: 0.02, tilt: 1.2, float: 1.4, size: 260 },
        airy:   { inTime: 0.6, outTime: 0.9, lift: 3, swell: 0.03, tilt: 2, float: 2, size: 260 },
        still:  { inTime: 0.35, outTime: 0.55, lift: 0, swell: 0.01, tilt: 0, float: 0.8, size: 260 },
      },
    },
    eyes: {
      title: 'Eyes',
      dials: {
        curve:    { label: 'Arc curve',          min: 0.4, max: 4, step: 0.05 },
        width:    { label: 'Arc width',          min: 2.5, max: 5.5, step: 0.05 },
        stroke:   { label: 'Stroke weight',      min: 0.8, max: 2.4, step: 0.05 },
        raise:    { label: 'Arc height offset',  min: -1.5, max: 1.5, step: 0.05 },
        squint:   { label: 'Squint overlap',     min: 0, max: 0.6, step: 0.01 },
        gaze:     { label: 'Eye follow',         min: 0, max: 2, step: 0.05 },
        blinkGap: { label: 'Blink every (s)',    min: 1.5, max: 8, step: 0.1 },
      },
      presets: {
        crescent: { curve: 2.2, width: 4.4, stroke: 1.45, raise: 0.2, squint: 0.3, gaze: 1.2, blinkGap: 3.6 },
        soft:     { curve: 1.3, width: 4.2, stroke: 1.25, raise: 0.5, squint: 0.4, gaze: 1, blinkGap: 4.2 },
        beaming:  { curve: 3, width: 4.8, stroke: 1.6, raise: 0, squint: 0.22, gaze: 1.2, blinkGap: 3.2 },
        sleepy:   { curve: 0.8, width: 4.2, stroke: 1.2, raise: 0.9, squint: 0.5, gaze: 0.6, blinkGap: 5 },
      },
    },
    blush: {
      title: 'Blush',
      dials: {
        color:    { label: 'Color', type: 'color' },
        amount:   { label: 'Strength',           min: 0, max: 1, step: 0.01 },
        rx:       { label: 'Width',              min: 0.8, max: 4, step: 0.05 },
        ry:       { label: 'Height',             min: 0.4, max: 2.5, step: 0.05 },
        soft:     { label: 'Softness',           min: 0, max: 1, step: 0.01 },
        spread:   { label: 'Distance from center', min: 4, max: 9, step: 0.05 },
        y:        { label: 'Height on face',     min: 15, max: 21, step: 0.05 },
        delay:    { label: 'Lag behind eyes',    min: 0, max: 0.6, step: 0.01 },
      },
      presets: {
        whisper: { color: '#ff9fb4', amount: 0.45, rx: 2.2, ry: 1.2, soft: 0.8, spread: 6.2, y: 17.8, delay: 0.2 },
        rosy:    { color: '#ff8aa6', amount: 0.75, rx: 2.4, ry: 1.3, soft: 0.6, spread: 6.2, y: 17.8, delay: 0.15 },
        peach:   { color: '#ffb08a', amount: 0.6, rx: 2.6, ry: 1.4, soft: 0.75, spread: 6, y: 18.2, delay: 0.2 },
        off:     { color: '#ff9fb4', amount: 0, rx: 2.2, ry: 1.2, soft: 0.8, spread: 6.2, y: 17.8, delay: 0.2 },
      },
    },
    sparkles: {
      title: 'Sparkles',
      dials: {
        color:    { label: 'Color', type: 'color' },
        rate:     { label: 'Per second',         min: 0, max: 10, step: 0.1 },
        burst:    { label: 'Burst on hover',     min: 0, max: 10, step: 1 },
        size:     { label: 'Size (px)',          min: 4, max: 22, step: 0.5 },
        radius:   { label: 'Ring radius',        min: 0.3, max: 0.8, step: 0.01 },
        arc:      { label: 'Arc (deg)',          min: 30, max: 360, step: 1 },
        drift:    { label: 'Drift outward (%)',  min: 0, max: 20, step: 0.5 },
        life:     { label: 'Life (s)',           min: 0.4, max: 2.5, step: 0.05 },
        maxOpacity: { label: 'Brightness',       min: 0.2, max: 1, step: 0.01 },
      },
      presets: {
        twinkle: { color: '#ffffff', rate: 2.2, burst: 0, size: 9, radius: 0.46, arc: 200, drift: 3, life: 1.3, maxOpacity: 0.85 },
        halo:    { color: '#fff4d6', rate: 4, burst: 0, size: 7, radius: 0.5, arc: 360, drift: 1.5, life: 1.6, maxOpacity: 0.7 },
        burst:   { color: '#ffffff', rate: 0.8, burst: 5, size: 10, radius: 0.42, arc: 150, drift: 9, life: 1, maxOpacity: 0.95 },
        off:     { color: '#ffffff', rate: 0, burst: 0, size: 9, radius: 0.46, arc: 200, drift: 3, life: 1.3, maxOpacity: 0.85 },
      },
    },
  }
  const DEFAULTS = { feel: 'calm', eyes: 'crescent', blush: 'whisper', sparkles: 'twinkle' }

  const v = {}
  const active = {}
  const inputs = {}
  const panel = $('panel')

  for (const [gk, g] of Object.entries(GROUPS)) {
    const section = document.createElement('section')
    section.className = 'section'
    section.innerHTML = `<h2>${g.title}</h2><div class="presets"></div><div class="rows"></div>`
    panel.append(section)
    const presetsEl = section.querySelector('.presets')
    for (const name of Object.keys(g.presets)) {
      const b = document.createElement('button')
      b.type = 'button'
      b.textContent = name
      b.dataset.group = gk
      b.addEventListener('click', () => applyPreset(gk, name))
      presetsEl.append(b)
    }
    inputs[gk] = {}
    for (const [dk, d] of Object.entries(g.dials)) {
      const row = document.createElement('div')
      row.className = 'row'
      const id = `${gk}-${dk}`
      row.innerHTML = d.type === 'color'
        ? `<label for="${id}">${d.label}</label><input type="color" id="${id}">`
        : `<label for="${id}">${d.label}</label><output></output><input type="range" id="${id}" min="${d.min}" max="${d.max}" step="${d.step}">`
      section.querySelector('.rows').append(row)
      const input = row.querySelector('input')
      input.addEventListener('input', () => {
        v[gk][dk] = d.type === 'color' ? input.value : parseFloat(input.value)
        active[gk] = null
        sync()
      })
      inputs[gk][dk] = input
    }
  }
  const actions = document.createElement('div')
  actions.className = 'actions'
  actions.innerHTML = '<button type="button" id="copy">Copy values</button><button type="button" id="reset">Reset</button>'
  panel.append(actions)

  function applyPreset(gk, name) {
    v[gk] = { ...GROUPS[gk].presets[name] }
    active[gk] = name
    sync()
  }
  function sync() {
    for (const [gk, g] of Object.entries(GROUPS)) {
      for (const [dk, d] of Object.entries(g.dials)) {
        const input = inputs[gk][dk]
        input.value = v[gk][dk]
        if (d.type !== 'color') input.previousElementSibling.textContent = +(+v[gk][dk]).toFixed(3)
      }
    }
    for (const b of panel.querySelectorAll('.presets button')) b.setAttribute('aria-pressed', String(active[b.dataset.group] === b.textContent))
    document.documentElement.style.setProperty('--size', v.feel.size + 'px')
    document.documentElement.style.setProperty('--blush', v.blush.color)
    blushEdge.setAttribute('offset', '1')
    // Softness pulls the solid core inward so the edge fades over a wider band.
    blushEdge.previousElementSibling.setAttribute('offset', (1 - v.blush.soft).toFixed(3))
    for (const [el, sign] of [[blushL, -1], [blushR, 1]]) {
      el.setAttribute('cx', 16 + sign * v.blush.spread)
      el.setAttribute('cy', v.blush.y)
      el.setAttribute('rx', v.blush.rx)
      el.setAttribute('ry', v.blush.ry)
    }
    shapeArcs()
  }
  function reset() {
    for (const [gk, name] of Object.entries(DEFAULTS)) { v[gk] = { ...GROUPS[gk].presets[name] }; active[gk] = name }
    sync()
  }
  reset()
  $('reset').onclick = reset
  $('copy').onclick = async () => {
    const text = JSON.stringify(v, null, 2)
    try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Copied' } catch { console.log(text) }
    setTimeout(() => ($('copy').textContent = 'Copy values'), 1200)
  }
  $('panelToggle').onclick = () => panel.classList.toggle('is-hidden')

  // ^ ^ arcs centred on each eye, shaped by the eye dials.
  function shapeArcs() {
    const e = v.eyes
    for (const [el, cx] of [[happyL, 12.1], [happyR, 20.3]]) {
      const y = 13.9 - e.raise
      const half = e.width / 2
      el.setAttribute('d', `M${cx - half} ${y + e.curve * 0.45} Q${cx} ${y - e.curve * 1.1} ${cx + half} ${y + e.curve * 0.45}`)
      el.setAttribute('stroke-width', e.stroke)
    }
  }

  // ---------- Motion ----------
  // Critically damped smoothing (no overshoot, no snap): the value glides to its
  // target with a time constant, and velocity carries through direction changes.
  function smoothDamp(s, target, time, dt) {
    const omega = 2 / Math.max(0.0001, time)
    const x = omega * dt
    const exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x)
    const change = s.x - target
    const temp = (s.v + omega * change) * dt
    s.v = (s.v - omega * temp) * exp
    s.x = target + (change + temp) * exp
  }
  const ease = (t) => t * t * (3 - 2 * t) // smoothstep
  const band = (x, a, b) => ease(Math.min(1, Math.max(0, (x - a) / (b - a))))

  const joy = { x: 0, v: 0 }
  const blushJoy = { x: 0, v: 0 }
  const gaze = { x: 0, y: 0, tx: 0, ty: 0 }
  const blinkState = { x: 0, v: 0 }
  let hovering = false
  let touchTimer = 0
  let sparkleDebt = 0
  let nextBlink = performance.now() + 2500
  let blinkUntil = 0
  let last = performance.now()
  const t0 = last

  // Hover = over the body shape itself, not the square around it.
  shell.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') setHover(true) })
  shell.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') setHover(false) })
  shell.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return
    setHover(true)
    clearTimeout(touchTimer)
    touchTimer = setTimeout(() => setHover(false), 2200)
  })
  function setHover(on) {
    if (on === hovering) return
    hovering = on
    if (on && !reduced) for (let i = 0; i < v.sparkles.burst; i++) spawnSparkle(i * 45)
  }

  addEventListener('pointermove', (e) => {
    const r = stage.getBoundingClientRect()
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * 0.42)
    const dist = Math.hypot(dx, dy) || 1
    const reach = Math.min(1, dist / (r.width * 1.4))
    gaze.tx = (dx / dist) * reach
    gaze.ty = (dy / dist) * reach
  })
  document.addEventListener('pointerleave', () => { gaze.tx = 0; gaze.ty = 0 })

  // ---------- Sparkles ----------
  const STAR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c.7 6.3 5.7 11.3 12 12-6.3.7-11.3 5.7-12 12-.7-6.3-5.7-11.3-12-12C6.3 11.3 11.3 6.3 12 0Z"/></svg>'
  function spawnSparkle(delay = 0) {
    const s = v.sparkles
    const el = document.createElement('span')
    el.className = 'sparkle'
    el.innerHTML = STAR
    el.style.color = s.color
    el.style.width = el.style.height = s.size + 'px'
    el.style.margin = `${-s.size / 2}px 0 0 ${-s.size / 2}px`
    const size = stage.clientWidth
    const arc = (s.arc * Math.PI) / 180
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * arc
    const r = s.radius * size * (0.9 + Math.random() * 0.2)
    const cx = size / 2, cy = size * 0.44
    const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r
    const dx = Math.cos(angle) * (s.drift / 100) * size, dy = Math.sin(angle) * (s.drift / 100) * size
    const scale = 0.55 + Math.random() * 0.5
    const spin = (Math.random() < 0.5 ? -1 : 1) * (20 + Math.random() * 30)
    sparkLayer.append(el)
    el.animate([
      { transform: `translate(${x}px, ${y}px) scale(0) rotate(0deg)`, opacity: 0 },
      { transform: `translate(${x + dx * 0.45}px, ${y + dy * 0.45}px) scale(${scale}) rotate(${spin * 0.5}deg)`, opacity: s.maxOpacity, offset: 0.45 },
      { transform: `translate(${x + dx}px, ${y + dy}px) scale(0) rotate(${spin}deg)`, opacity: 0 },
    ], { duration: s.life * 1000 * (0.85 + Math.random() * 0.3), delay, easing: 'cubic-bezier(0.37, 0, 0.63, 1)', fill: 'both' })
      .finished.then(() => el.remove())
  }

  // ---------- Loop ----------
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000)
    last = now
    const t = (now - t0) / 1000
    const f = v.feel, e = v.eyes

    smoothDamp(joy, hovering ? 1 : 0, hovering ? f.inTime : f.outTime, dt)
    smoothDamp(blushJoy, hovering ? 1 : 0, (hovering ? f.inTime : f.outTime) + v.blush.delay, dt)
    const j = Math.min(1, Math.max(0, joy.x))
    const k = ease(j)

    // Body: slow idle float that hands over to a gentle lift, swell and sway.
    const floatY = Math.sin(t * 1.4) * f.float * (1 - k * 0.6)
    const y = (floatY - f.lift * k) * f.size / 100
    const sway = Math.sin(t * 1.9) * f.tilt * k + Math.sin(t * 0.9) * 0.6 * (1 - k)
    const s = 1 + f.swell * k
    bot.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0) rotate(${sway.toFixed(3)}deg) scale(${s.toFixed(4)})`

    // Blink: a short smooth close/open, only while resting.
    if (now > nextBlink && j < 0.05) {
      blinkUntil = now + 90
      nextBlink = now + e.blinkGap * 1000 * (0.7 + Math.random() * 0.6)
    }
    smoothDamp(blinkState, now < blinkUntil ? 1 : 0, 0.045, dt)
    const blink = Math.min(1, Math.max(0, blinkState.x))

    // Eyes: follow the pointer, then squint shut while the arcs rise out of the squint.
    const lerp = 1 - Math.exp(-dt * 8)
    gaze.x += (gaze.tx - gaze.x) * lerp
    gaze.y += (gaze.ty - gaze.y) * lerp
    const gx = gaze.x * e.gaze * (1 - k), gy = gaze.y * e.gaze * 0.8 * (1 - k)
    const close = band(j, 0, 0.55 + e.squint * 0.4)
    const scaleY = Math.max(0.04, (1 - close) * (1 - blink * 0.9))
    const ovalOpacity = 1 - band(j, 0.35 + e.squint * 0.3, 0.6 + e.squint * 0.4)
    const eyeT = `translate(${gx.toFixed(3)}px, ${gy.toFixed(3)}px) scale(1, ${scaleY.toFixed(3)})`
    eyeL.style.transform = eyeR.style.transform = eyeT
    eyeL.style.opacity = eyeR.style.opacity = ovalOpacity.toFixed(3)

    const draw = band(j, 0.45 - e.squint * 0.4, 1)
    // Draw from the centre out: dash sits in the middle and widens both ways.
    const arcs = [happyL, happyR]
    for (const el of arcs) {
      el.style.strokeDasharray = `${draw.toFixed(4)} 1`
      el.style.strokeDashoffset = (-(1 - draw) / 2).toFixed(4)
      // Round caps paint a dot even for a zero-length dash; hide until drawing starts.
      el.style.opacity = draw > 0.005 ? Math.min(1, draw * 3).toFixed(3) : '0'
      el.style.transform = `translateY(${((1 - draw) * 0.6).toFixed(3)}px)`
    }

    const b = ease(Math.min(1, Math.max(0, blushJoy.x))) * v.blush.amount
    blushL.setAttribute('opacity', b.toFixed(3))
    blushR.setAttribute('opacity', b.toFixed(3))

    // Sparkles: a steady trickle that scales with joy.
    if (!reduced && v.sparkles.rate > 0) {
      sparkleDebt += v.sparkles.rate * dt * k
      while (sparkleDebt >= 1) { sparkleDebt -= 1; spawnSparkle() }
    }
    if (k < 0.01) sparkleDebt = 0

    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
})()
</script>
</body>
</html>
