<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re:Self system design — simplified</title>
    <style>
      @font-face { font-family: 'Beatrice'; src: url('/fonts/Beatrice-Regular.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Beatrice'; src: url('/fonts/Beatrice-Medium.woff2') format('woff2'); font-weight: 500; }
      :root { --ink: #171717; --stone: #6f6b68; --soft: #a6a09c; --paper: #f5f5f5; --unwind: #53bffe; --font: 'Beatrice', system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); letter-spacing: -0.02em; }
      header, .option { max-width: 1200px; margin: 0 auto; padding: 48px 44px 16px; }
      h1 { margin: 0 0 8px; font-size: 40px; font-weight: 400; letter-spacing: -0.04em; }
      header p { margin: 0; color: var(--stone); max-width: 640px; line-height: 1.45; }
      .option__head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; }
      .option__num { color: var(--soft); font-size: 14px; }
      .option__name { font-size: 22px; font-weight: 500; }
      .option__note { color: var(--stone); font-size: 15px; flex: 1; }
      button { font: inherit; font-size: 13px; border: 1px solid var(--ink); background: none; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
      .frame { background: #fff; border-radius: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 32px rgba(0,0,0,.05); overflow: hidden; }
      svg { display: block; width: 100%; height: auto; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      .flow { stroke-dasharray: 2 10; stroke-linecap: round; animation: flow 1s linear infinite; }
    </style>
  </head>
  <body>
    <header>
      <h1>Re:Self system — simplified</h1>
      <p>Five lighter takes. One or two words per idea, fewer arrows, the story told in the order a person experiences it.</p>
    </header>
    <main id="options"></main>
    <script>
      const W = 1200, H = 620, INK = '#171717', STONE = '#6f6b68', SOFT = '#a6a09c', BLUE = '#53bffe'
      const F = "font-family=\"Beatrice, system-ui, sans-serif\""

      // Simple line icons centred on (x, y), size s.
      function icon(kind, x, y, s = 56, c = INK, sw = 2.5) {
        const h = s / 2, a = `fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"`
        const g = (b) => `<g ${a}>${b}</g>`
        if (kind === 'you') return g(`<circle cx="${x}" cy="${y - h * .35}" r="${h * .38}"/><path d="M${x - h * .75} ${y + h * .85}a${h * .75} ${h * .7} 0 0 1 ${h * 1.5} 0"/>`)
        if (kind === 'watch') return g(`<rect x="${x - h * .5}" y="${y - h * .55}" width="${h}" height="${h * 1.1}" rx="${h * .25}"/><path d="M${x - h * .3} ${y - h * .55}l${h * .08} -${h * .4}h${h * .44}l${h * .08} ${h * .4}M${x - h * .3} ${y + h * .55}l${h * .08} ${h * .4}h${h * .44}l${h * .08} -${h * .4}"/>`)
        if (kind === 'phone') return g(`<rect x="${x - h * .5}" y="${y - h * .9}" width="${h}" height="${h * 1.8}" rx="${h * .2}"/><path d="M${x - h * .12} ${y + h * .68}h${h * .24}"/>`)
        if (kind === 'ai') return g(`<path d="M${x} ${y - h * .85}C${x + h * .08} ${y - h * .1} ${x + h * .1} ${y - h * .08} ${x + h * .85} ${y}C${x + h * .1} ${y + h * .08} ${x + h * .08} ${y + h * .1} ${x} ${y + h * .85}C${x - h * .08} ${y + h * .1} ${x - h * .1} ${y + h * .08} ${x - h * .85} ${y}C${x - h * .1} ${y - h * .08} ${x - h * .08} ${y - h * .1} ${x} ${y - h * .85}Z"/>`)
        if (kind === 'care') return g(`<path d="M${x} ${y + h * .75}C${x - h} ${y + h * .05} ${x - h * .9} ${y - h * .85} ${x} ${y - h * .35}C${x + h * .9} ${y - h * .85} ${x + h} ${y + h * .05} ${x} ${y + h * .75}Z"/>`)
        return ''
      }
      const text = (x, y, t, o = {}) =>
        `<text x="${x}" y="${y}" ${F} font-size="${o.size || 20}" font-weight="${o.weight || 400}" fill="${o.fill || INK}" text-anchor="${o.anchor || 'middle'}" letter-spacing="${o.ls || '-0.02em'}">${t}</text>`
      const arrowDefs = (id, c) =>
        `<marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>`
      const line = (x1, y1, x2, y2, o = {}) =>
        `<path d="M${x1} ${y1}${o.curve ? `Q${o.curve[0]} ${o.curve[1]} ` : 'L'}${x2} ${y2}" fill="none" stroke="${o.c || INK}" stroke-width="${o.w || 2}" ${o.dash ? `stroke-dasharray="${o.dash}"` : ''} class="${o.cls || ''}" marker-end="url(#${o.m || 'a'})"/>`
      const svg = (body, h = H) =>
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h}"><defs>${arrowDefs('a', INK)}${arrowDefs('b', BLUE)}${arrowDefs('s', SOFT)}</defs><rect width="${W}" height="${h}" fill="#fff"/>${body}</svg>`

      const options = [
        {
          id: 'hub', name: 'Hub', note: 'AI in the middle. Four one-word flows. Nothing else.',
          build() {
            const c = [600, 310], n = { you: [210, 310], watch: [600, 90], phone: [600, 530], care: [990, 310] }
            let b = `<circle cx="600" cy="310" r="74" fill="${BLUE}" fill-opacity=".12"/>` + icon('ai', 600, 300, 64) + text(600, 356, 'Re:Self AI', { size: 16, weight: 500 })
            const lab = { you: 'You', watch: 'Watch', phone: 'Phone', care: 'Therapist' }
            for (const k in n) { const [x, y] = n[k]; b += icon(k, x, y - 10, 56) + text(x, y + (k === 'watch' ? 52 : k === 'phone' ? 60 : 48), lab[k], { size: 17, weight: 500 }) }
            b += line(300, 300, 510, 300, { m: 'a' }) + text(405, 285, 'reflects', { size: 15, fill: STONE })
            b += line(600, 160, 600, 222, { m: 'a' }) + text(620, 198, 'senses', { size: 15, fill: STONE, anchor: 'start' })
            b += line(600, 392, 600, 450, { c: BLUE, m: 'b' }) + text(620, 428, 'prompts', { size: 15, fill: BLUE, anchor: 'start' })
            b += line(690, 300, 900, 300, { c: BLUE, m: 'b' }) + text(795, 285, 'insights', { size: 15, fill: BLUE })
            return svg(b)
          },
        },
        {
          id: 'loop', name: 'Loop', note: 'The experience as a cycle. Therapists sit outside it as support.',
          build() {
            const pts = [['watch', 'Watch notices', 330, 170], ['ai', 'AI understands', 670, 170], ['phone', 'Phone prompts', 670, 450], ['you', 'You reflect', 330, 450]]
            let b = ''
            b += line(400, 150, 600, 150, { m: 'a', curve: [500, 110] }) + line(720, 220, 720, 380, { m: 'b', c: BLUE, curve: [770, 300] })
            b += line(600, 470, 400, 470, { m: 'a', curve: [500, 510] }) + line(280, 380, 280, 220, { m: 'a', curve: [230, 300] })
            for (const [k, t, x, y] of pts) b += `<circle cx="${x}" cy="${y}" r="52" fill="#fff"/>` + icon(k, x, y, 50, k === 'ai' ? BLUE : INK) + text(x, y < 300 ? y - 62 : y + 80, t, { size: 17, weight: 500 })
            b += line(760, 170, 930, 170, { c: SOFT, m: 's', dash: '4 6' }) + icon('care', 990, 170, 56) + text(990, 240, 'Therapist', { size: 17, weight: 500 }) + text(990, 264, 'optional, shared insights', { size: 14, fill: STONE })
            b += text(500, 306, 'every day', { size: 15, fill: SOFT })
            return svg(b)
          },
        },
        {
          id: 'steps', name: 'Three steps', note: 'Capture, understand, support. Reads left to right in one glance.',
          build() {
            const cols = [
              [210, '01', 'Capture', [['watch', 'Watch'], ['phone', 'Phone']]],
              [600, '02', 'Understand', [['ai', 'Re:Self AI']]],
              [990, '03', 'Support', [['you', 'You'], ['care', 'Therapist']]],
            ]
            let b = ''
            for (const [x, n, t, items] of cols) {
              b += text(x, 110, n, { size: 14, fill: SOFT }) + text(x, 146, t, { size: 30, weight: 500, ls: '-0.04em' })
              items.forEach(([k, l], i) => {
                const y = items.length === 1 ? 350 : 280 + i * 150
                b += icon(k, x, y, 56, k === 'ai' ? BLUE : INK) + text(x, y + 56, l, { size: 16, fill: STONE })
              })
            }
            b += line(320, 350, 490, 350, { m: 'a' }) + line(710, 350, 880, 350, { c: BLUE, m: 'b' })
            return svg(b)
          },
        },
        {
          id: 'story', name: 'Story strip', note: 'Four frames, one short sentence each. Works as a caption row too.',
          build() {
            const s = [['watch', 'Your watch', 'notices stress'], ['ai', 'Re:Self AI', 'understands context'], ['phone', 'Your phone', 'asks one question'], ['care', 'Your therapist', 'sees the pattern']]
            let b = ''
            s.forEach(([k, a, c], i) => {
              const x = 150 + i * 300
              b += `<rect x="${x - 120}" y="150" width="240" height="320" rx="24" fill="${k === 'ai' ? '#eef8ff' : '#f5f5f5'}"/>`
              b += text(x - 96, 194, `0${i + 1}`, { size: 14, fill: SOFT, anchor: 'start' })
              b += icon(k, x, 290, 72, k === 'ai' ? BLUE : INK)
              b += text(x, 392, a, { size: 20, weight: 500 }) + text(x, 420, c, { size: 16, fill: STONE })
              if (i < 3) b += line(x + 128, 310, x + 168, 310, { m: 's', c: SOFT, w: 1.5 })
            })
            return svg(b)
          },
        },
        {
          id: 'quiet', name: 'Quiet flow', note: 'No edge labels. Motion shows direction; five names do the rest.',
          build() {
            const n = { watch: [220, 200, 'Watch'], phone: [220, 440, 'Phone'], ai: [600, 320, 'Re:Self AI'], you: [980, 200, 'You'], care: [980, 440, 'Therapist'] }
            let b = ''
            b += line(280, 215, 530, 300, { cls: 'flow', m: 'a' }) + line(280, 425, 530, 340, { cls: 'flow', m: 'a' })
            b += line(670, 300, 920, 215, { cls: 'flow', c: BLUE, m: 'b' }) + line(670, 340, 920, 425, { cls: 'flow', c: BLUE, m: 'b' })
            for (const k in n) { const [x, y, t] = n[k]; b += icon(k, x, y, k === 'ai' ? 72 : 52, k === 'ai' ? BLUE : INK) + text(x, y + (k === 'ai' ? 70 : 62), t, { size: 17, weight: 500 }) }
            return svg(b)
          },
        },
      ]

      const root = document.getElementById('options')
      options.forEach((o, i) => {
        const el = document.createElement('section')
        el.className = 'option'
        el.id = o.id
        const markup = o.build()
        el.innerHTML = `<div class="option__head"><span class="option__num">0${i + 1}</span><span class="option__name">${o.name}</span><span class="option__note">${o.note}</span><button>Download SVG</button></div><div class="frame">${markup}</div>`
        el.querySelector('button').onclick = () => {
          const a = document.createElement('a')
          a.href = URL.createObjectURL(new Blob([markup], { type: 'image/svg+xml' }))
          a.download = `reself-system-${o.id}.svg`
          a.click()
        }
        root.append(el)
      })
    </script>
  </body>
</html>
