<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re:Self system design — options</title>
    <style>
      @font-face {
        font-family: 'Beatrice';
        src: url('/fonts/Beatrice-Regular.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Beatrice';
        src: url('/fonts/Beatrice-Medium.woff2') format('woff2');
        font-weight: 500;
      }
      :root {
        --ink-900: #171717;
        --stone-600: #6f6b68;
        --stone-400: #a6a09c;
        --paper: #f5f5f5;
        --unwind: #53bffe;
        --font: 'Beatrice', system-ui, -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink-900);
        font-family: var(--font);
        letter-spacing: -0.02em;
      }
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 56px 44px 8px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 40px;
        font-weight: 400;
        letter-spacing: -0.04em;
      }
      header p {
        margin: 0;
        color: var(--stone-600);
        font-size: 16px;
        max-width: 640px;
        line-height: 1.45;
      }
      .option {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 44px 24px;
      }
      .option__head {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 16px;
      }
      .option__head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .option__head p {
        margin: 0;
        color: var(--stone-600);
        font-size: 14px;
        flex: 1;
      }
      .option__head button {
        font: inherit;
        font-size: 13px;
        color: var(--ink-900);
        background: none;
        border: 1px solid var(--stone-400);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .option__head button:hover {
        border-color: var(--ink-900);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .flow {
        animation: flow 1.6s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -24;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Re:Self system design</h1>
      <p>
        Five treatments in the site's system: paper background, ink strokes and text, Beatrice. The computer app is
        now the phone app, and its activity data is touch-based.
      </p>
    </header>
    <main id="options"></main>

    <script>
      const INK = '#171717'
      const STONE = '#6f6b68'
      const STONE_LIGHT = '#a6a09c'
      const BLUE = '#53BFFE'
      const W = 1460
      const H = 720

      // ---------- Content (one source for every option) ----------
      const NODES = {
        user: { x: 112, y: 385, title: ['RE:SELF USER'], icon: 'person' },
        watch: { x: 512, y: 130, title: ['RE:SELF WATCH APP'], icon: 'watch', titleBelow: 82 },
        db: { x: 907, y: 378, title: ['SECURE DATABASE', '+ NOVEL AI MODEL'], icon: 'cloud' },
        therapist: { x: 1313, y: 385, title: ['REGISTERED THERAPISTS', 'COLLABORATING WITH RE:SELF'], icon: 'therapist' },
        phone: { x: 512, y: 618, title: ['RE:SELF PHONE APP'], icon: 'phone', titleBelow: 80 },
      }
      // kind: data (user → system), ai (model output), training (therapists)
      const EDGES = [
        {
          kind: 'data',
          points: [[112, 292], [112, 128], [452, 128]],
          label: { x: 138, y: 164, anchor: 'start', head: 'Contextual user data:', items: ['biometrics', 'voice entries', 'movement', 'surrounding noise'] },
        },
        {
          kind: 'ai',
          points: [[907, 302], [907, 128], [572, 128]],
          label: { x: 883, y: 164, anchor: 'end', lines: ['Micro-reflection', 'prompt generation'] },
        },
        {
          kind: 'ai',
          points: [[502, 222], [502, 368], [192, 368]],
          label: { x: 476, y: 318, anchor: 'end', lines: ['Context-aware daily', 'micro-reflection prompts'] },
        },
        {
          kind: 'data',
          points: [[522, 222], [522, 368], [818, 368]],
          label: { x: 548, y: 336, anchor: 'start', lines: ['Contextual user data'] },
        },
        {
          kind: 'ai',
          points: [[502, 548], [502, 388], [192, 388]],
          label: { x: 476, y: 422, anchor: 'end', head: 'Interactive journal space:', items: ['daily entries', 'counterfactuals', 'behavior plans'] },
        },
        {
          kind: 'data',
          points: [[522, 548], [522, 388], [818, 388]],
          label: { x: 548, y: 422, anchor: 'start', lines: ['Activity user data'] },
        },
        {
          kind: 'data',
          points: [[112, 502], [112, 612], [448, 612]],
          label: { x: 138, y: 548, anchor: 'start', head: 'Activity user data:', items: ['touch & scroll interactions', 'content updates'] },
        },
        {
          kind: 'ai',
          points: [[907, 520], [907, 612], [576, 612]],
          label: { x: 883, y: 556, anchor: 'end', lines: ['Daily entries +', 'counterfactual', 'generation'] },
        },
        {
          kind: 'training',
          points: [[1232, 378], [998, 378]],
          label: { x: 1000, y: 314, anchor: 'start', head: 'Training data:', items: ['counterfactual generation', 'micro-reflection prompting'] },
        },
      ]

      // ---------- Options ----------
      const OPTIONS = [
        {
          id: 'outline',
          name: 'Outline',
          note: 'Closest to the original: same layout, ink strokes on paper.',
          stroke: 2.5,
          radius: 22,
          icon: 2.5,
          label: INK,
          labelSize: 15,
          titleSize: 14,
          titleWeight: 500,
          arrow: 'chevron',
        },
        {
          id: 'hairline',
          name: 'Hairline',
          note: 'Lighter and more editorial: thin strokes, grey labels, small tracked titles.',
          stroke: 1.25,
          radius: 28,
          icon: 1.5,
          label: STONE,
          labelSize: 14,
          titleSize: 12,
          titleWeight: 500,
          titleTrack: 0.08,
          arrow: 'triangle',
        },
        {
          id: 'discs',
          name: 'Discs',
          note: 'Each actor sits on a white disc with the site’s soft card shadow; lines are quieter.',
          stroke: 1.5,
          radius: 24,
          icon: 2,
          line: STONE_LIGHT,
          arrowColor: INK,
          label: INK,
          labelSize: 14,
          titleSize: 13,
          titleWeight: 500,
          arrow: 'triangle',
          disc: 64,
          dots: true,
        },
        {
          id: 'accent',
          name: 'Accent',
          note: 'Colour-coded flows: ink for user data, Unwind blue for AI output, dashed for training data.',
          stroke: 2,
          radius: 22,
          icon: 2,
          label: INK,
          labelSize: 14,
          titleSize: 13,
          titleWeight: 500,
          arrow: 'chevron',
          kinds: { data: { color: INK }, ai: { color: BLUE }, training: { color: STONE, dash: '6 7' } },
          legend: true,
        },
        {
          id: 'live',
          name: 'Live flow',
          note: 'Dotted lines that move in the direction data travels. Good for a scrolling case study.',
          stroke: 2.5,
          radius: 22,
          icon: 2,
          label: INK,
          labelSize: 14,
          titleSize: 13,
          titleWeight: 500,
          arrow: 'chevron',
          dash: '0.1 12',
          animate: true,
          kinds: { ai: { color: BLUE } },
        },
      ]

      // ---------- Drawing ----------
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

      /** Orthogonal polyline with rounded corners. */
      function path(points, r) {
        let d = `M${points[0][0]} ${points[0][1]}`
        for (let i = 1; i < points.length; i++) {
          const [x, y] = points[i]
          const next = points[i + 1]
          if (!next) {
            d += ` L${x} ${y}`
            break
          }
          const [px, py] = points[i - 1]
          const k = Math.min(r, Math.hypot(x - px, y - py) / 2, Math.hypot(next[0] - x, next[1] - y) / 2)
          const inX = x - Math.sign(x - px) * k
          const inY = y - Math.sign(y - py) * k
          const outX = x + Math.sign(next[0] - x) * k
          const outY = y + Math.sign(next[1] - y) * k
          d += ` L${inX} ${inY} Q${x} ${y} ${outX} ${outY}`
        }
        return d
      }

      function arrowHead(points, o, color, width) {
        const [x, y] = points[points.length - 1]
        const [px, py] = points[points.length - 2]
        const a = Math.atan2(y - py, x - px)
        const s = o.arrow === 'triangle' ? 7 + width * 1.5 : 7 + width * 2
        const p1 = [x - s * Math.cos(a - 0.6), y - s * Math.sin(a - 0.6)]
        const p2 = [x - s * Math.cos(a + 0.6), y - s * Math.sin(a + 0.6)]
        if (o.arrow === 'triangle') {
          return `<path d="M${x} ${y} L${p1} L${p2} Z" fill="${color}" />`
        }
        return `<path d="M${p1} L${x} ${y} L${p2}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" />`
      }

      function label(l, o) {
        const lh = o.labelSize * 1.3
        const out = []
        let y = l.y
        const text = (content, x, anchor, y) =>
          `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${o.labelSize}" fill="${o.label}">${content}</text>`
        if (l.lines) for (const line of l.lines) (out.push(text(esc(line), l.x, l.anchor, y)), (y += lh))
        if (l.head) {
          out.push(text(esc(l.head), l.x, l.anchor, y))
          y += lh
          // Bullets hang from the head's left edge (right-aligned heads keep their bullets on its left too).
          const width = Math.max(...[l.head, ...l.items].map((s) => s.length)) * o.labelSize * 0.5
          const left = l.anchor === 'end' ? l.x - width : l.x
          for (const item of l.items) {
            out.push(text(`•&#160;&#160;${esc(item)}`, left + o.labelSize * 1.1, 'start', y))
            y += lh
          }
        }
        return out.join('')
      }

      const ICONS = {
        person: (x, y, w) => `
          <circle cx="${x}" cy="${y - 26}" r="22" />
          <path d="M${x - 46} ${y + 50} v-12 q0 -36 46 -36 q46 0 46 36 v12 q0 6 -6 6 h-80 q-6 0 -6 -6 z" />`,
        therapist: (x, y, w) => `
          ${ICONS.person(x, y, w)}
          <path d="M${x - 18} ${y + 4} l18 22 l18 -22" />
          <path d="M${x + 26} ${y + 28} h14 M${x + 33} ${y + 21} v14" />`,
        watch: (x, y, w) => `
          <path d="M${x - 20} ${y - 34} v-14 q0 -6 6 -6 h28 q6 0 6 6 v14 M${x - 20} ${y + 34} v14 q0 6 6 6 h28 q6 0 6 -6 v-14" />
          <rect x="${x - 34}" y="${y - 34}" width="68" height="68" rx="16" />
          <path d="M${x + 34} ${y - 8} h6 v16 h-6" />
          <path d="M${x - 22} ${y} h10 l5 -12 l8 24 l6 -18 l4 6 h11" />`,
        cloud: (x, y, w) => `
          <path d="M${x - 40} ${y + 30} h80 a26 26 0 0 0 4 -51.7 a36 36 0 0 0 -68 -8 a28 28 0 0 0 -16 59.7 z" />
          <text x="${x + 2}" y="${y + 17}" text-anchor="middle" font-size="26" font-weight="500" stroke="none" fill="currentColor">AI</text>`,
        phone: (x, y, w) => `
          <rect x="${x - 30}" y="${y - 54}" width="60" height="108" rx="12" />
          <path d="M${x - 8} ${y - 45} h16" />
          <path d="M${x - 18} ${y - 26} h24 M${x - 18} ${y - 16} h36 M${x - 18} ${y - 6} h30 M${x - 18} ${y + 4} h36 M${x - 18} ${y + 14} h22" />
          <path d="M${x + 12} ${y + 34} v-12 M${x + 12} ${y + 28} m-6 -3.5 l12 7 M${x + 12} ${y + 28} m-6 3.5 l12 -7" />`,
      }

      function titleText(node, o) {
        const below = node.titleBelow ?? 104
        return node.title
          .map(
            (line, i) =>
              `<text x="${node.x}" y="${node.y + below + i * o.titleSize * 1.35}" text-anchor="middle" font-size="${o.titleSize}" font-weight="${o.titleWeight}" letter-spacing="${o.titleTrack ?? 0.04}em" fill="${INK}">${esc(line)}</text>`,
          )
          .join('')
      }

      function render(o) {
        const parts = []
        parts.push(`<defs><filter id="shadow-${o.id}" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.08"/></filter></defs>`)
        parts.push(`<rect width="${W}" height="${H}" fill="#f5f5f5" />`)

        for (const e of EDGES) {
          const kind = o.kinds?.[e.kind] ?? {}
          const color = kind.color ?? o.line ?? INK
          const dash = kind.dash ?? o.dash
          const cls = o.animate ? ' class="flow"' : ''
          parts.push(
            `<path d="${path(e.points, o.radius)}" fill="none" stroke="${color}" stroke-width="${o.stroke}" stroke-linecap="round" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ''}${cls} />`,
          )
          parts.push(arrowHead(e.points, o, kind.color ?? o.arrowColor ?? color, o.stroke))
          if (o.dots) parts.push(`<circle cx="${e.points[0][0]}" cy="${e.points[0][1]}" r="3.5" fill="${o.arrowColor ?? INK}" />`)
          parts.push(label(e.label, o))
        }

        for (const node of Object.values(NODES)) {
          if (o.disc) parts.push(`<circle cx="${node.x}" cy="${node.y}" r="${o.disc}" fill="#fff" filter="url(#shadow-${o.id})" />`)
          const scale = o.disc ? 0.78 : 1
          parts.push(
            `<g color="${INK}" fill="none" stroke="${INK}" stroke-width="${o.icon / scale}" stroke-linecap="round" stroke-linejoin="round" transform="translate(${node.x} ${node.y}) scale(${scale}) translate(${-node.x} ${-node.y})">${ICONS[node.icon](node.x, node.y, o.icon)}</g>`,
          )
          parts.push(titleText(node, o))
        }

        if (o.legend) {
          const items = [
            ['User data', INK, ''],
            ['AI output', BLUE, ''],
            ['Training data', STONE, '6 7'],
          ]
          items.forEach(([name, color, dash], i) => {
            const x = 1000 + i * 140
            parts.push(`<path d="M${x} 90 h28" stroke="${color}" stroke-width="${o.stroke}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''} />`)
            parts.push(`<text x="${x + 38}" y="95" font-size="13" fill="${STONE}">${name}</text>`)
          })
        }

        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Beatrice, system-ui, sans-serif" letter-spacing="-0.01em" role="img" aria-label="Re:Self system design — ${o.name}">${parts.join('')}</svg>`
      }

      const root = document.getElementById('options')
      OPTIONS.forEach((o, i) => {
        const section = document.createElement('section')
        section.className = 'option'
        section.id = o.id
        section.innerHTML = `
          <div class="option__head">
            <h2>${String(i + 1).padStart(2, '0')} — ${o.name}</h2>
            <p>${o.note}</p>
            <button type="button">Download SVG</button>
          </div>
          ${render(o)}`
        section.querySelector('button').addEventListener('click', () => {
          const blob = new Blob([section.querySelector('svg').outerHTML], { type: 'image/svg+xml' })
          const a = document.createElement('a')
          a.href = URL.createObjectURL(blob)
          a.download = `reself-system-design-${o.id}.svg`
          a.click()
          URL.revokeObjectURL(a.href)
        })
        root.append(section)
      })
    </script>
  </body>
</html>
