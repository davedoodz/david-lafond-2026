<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unwind system design — options</title>
    <style>
      @font-face {
        font-family: 'Beatrice';
        src: url('/fonts/Beatrice-Regular.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Beatrice';
        src: url('/fonts/Beatrice-Medium.woff2') format('woff2');
        font-weight: 500;
      }
      :root {
        --ink-900: #171717;
        --stone-600: #6f6b68;
        --stone-400: #a6a09c;
        --paper: #f5f5f5;
        --unwind: #53bffe;
        --font: 'Beatrice', system-ui, -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink-900);
        font-family: var(--font);
        letter-spacing: -0.02em;
      }
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 56px 44px 8px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 40px;
        font-weight: 400;
        letter-spacing: -0.04em;
      }
      header p {
        margin: 0;
        color: var(--stone-600);
        font-size: 16px;
        max-width: 640px;
        line-height: 1.45;
      }
      .option {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 44px 24px;
      }
      .option__head {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 16px;
      }
      .option__head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .option__head p {
        margin: 0;
        color: var(--stone-600);
        font-size: 14px;
        flex: 1;
      }
      .option__head button {
        font: inherit;
        font-size: 13px;
        color: var(--ink-900);
        background: none;
        border: 1px solid var(--stone-400);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .option__head button:hover {
        border-color: var(--ink-900);
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .flow {
        animation: flow 1.6s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -24;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow {
          animation: none;
        }
      }
      .option__head { flex-wrap: wrap; }
      .option__head label { font-size: 13px; }
      select { font: inherit; padding: 6px 10px; border: 1px solid var(--stone-400); border-radius: 8px; background: white; }
      .story .edge, .story .node { transition: opacity 0.6s ease; opacity: 0.16; }
      .story .edge.is-on, .story .node.is-on { opacity: 1; }
      .story .edge.is-on > path:not(.edge__line) { fill: var(--unwind); transition: fill 0.4s ease 0.8s; }
      .story .node__halo { opacity: 0; transition: opacity 0.6s ease; }
      .story .node.is-on .node__halo { opacity: 0.1; }
      .story .trace { fill: none; stroke: var(--unwind); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .story .pulse { fill: var(--unwind); opacity: 0; }
      .story .ring { fill: none; stroke: var(--unwind); stroke-width: 1.5; opacity: 0; }
      .story .tide { fill: none; stroke: var(--unwind); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 0.1 9; opacity: 0; }
      .story .comet { fill: none; stroke: var(--unwind); stroke-width: 3; stroke-linecap: round; }
      .story .comet--glow { stroke-width: 9; stroke-opacity: 0.45; }
      .story[data-feel='breathe'] .node.is-on .node__halo { animation: halo-breathe 5.2s ease-in-out infinite; }
      @keyframes halo-breathe { 50% { opacity: 0.16; } }
      @media (prefers-reduced-motion: reduce) { .story .node__halo { animation: none !important; } }
      .story__caption { display: flex; gap: 16px; align-items: baseline; min-height: 64px; }
      .story__num { font-size: 32px; color: var(--unwind); letter-spacing: -0.04em; }
      .story__title { font-size: 20px; font-weight: 500; }
      .story__text { margin: 4px 0 0; color: var(--stone-600); font-size: 16px; max-width: 720px; }
      .story__steps { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
      .story__steps button { font: inherit; font-size: 13px; color: var(--stone-600); background: none; border: 1px solid var(--stone-400); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
      .story__steps button span { margin-right: 6px; color: var(--stone-400); }
      .story__steps button[aria-current='true'] { color: var(--ink-900); border-color: var(--ink-900); }
    </style>
  </head>
  <body>
    <header>
      <h1>Unwind system design</h1>
      <p>
        Five treatments with blue illustrations and Lucide point icons. Choose an arrow preset per diagram; SVG downloads include the selected style and embedded illustrations.
      </p>
    </header>
    <main id="options"></main>

    <script type="module">
      import { __iconData as activity } from '/node_modules/lucide-react/dist/esm/icons/activity.mjs'
      import { __iconData as mic } from '/node_modules/lucide-react/dist/esm/icons/mic.mjs'
      import { __iconData as footsteps } from '/node_modules/lucide-react/dist/esm/icons/footprints.mjs'
      import { __iconData as audio } from '/node_modules/lucide-react/dist/esm/icons/audio-lines.mjs'
      import { __iconData as book } from '/node_modules/lucide-react/dist/esm/icons/book-open.mjs'
      import { __iconData as branch } from '/node_modules/lucide-react/dist/esm/icons/git-branch.mjs'
      import { __iconData as target } from '/node_modules/lucide-react/dist/esm/icons/target.mjs'
      import { __iconData as touch } from '/node_modules/lucide-react/dist/esm/icons/hand.mjs'
      import { __iconData as refresh } from '/node_modules/lucide-react/dist/esm/icons/refresh-cw.mjs'
      import { __iconData as message } from '/node_modules/lucide-react/dist/esm/icons/message-circle.mjs'
      const POINT_ICONS = {
        biometrics: activity, 'voice entries': mic, movement: footsteps, 'surrounding noise': audio,
        'daily entries': book, counterfactuals: branch, 'behavior plans': target,
        'touch & scroll interactions': touch, 'content updates': refresh,
        'counterfactual generation': branch, 'micro-reflection prompting': message,
      }
      const assets = Object.fromEntries(await Promise.all(['user', 'cloud', 'phone', 'watch', 'therapist'].map(async name => {
        const response = await fetch(`assets/blue-${name}.png`)
        if (!response.ok) throw new Error(`Unable to load blue-${name}`)
        const blob = await response.blob()
        const data = await new Promise((resolve, reject) => {
          const reader = new FileReader()
          reader.onload = () => resolve(reader.result)
          reader.onerror = reject
          reader.readAsDataURL(blob)
        })
        return [name, data]
      })))
      const ARROWS = {
        original: { name: 'Original treatment' },
        solid: { name: 'Solid · open tip', dash: '', arrow: 'chevron', animate: false },
        dotted: { name: 'Dotted · open tip', dash: '0.1 10', arrow: 'chevron', animate: false },
        dashed: { name: 'Dashed · filled tip', dash: '8 7', arrow: 'triangle', animate: false },
        fine: { name: 'Fine · filled tip', dash: '', stroke: 1.2, arrow: 'triangle', animate: false },
        flowing: { name: 'Flowing · dotted', dash: '0.1 12', arrow: 'chevron', animate: true },
      }
      const INK = '#171717'
      const STONE = '#6f6b68'
      const STONE_LIGHT = '#a6a09c'
      const BLUE = '#53BFFE'
      const W = 1460
      const H = 720

      // ---------- Content (one source for every option) ----------
      const NODES = {
        user: { x: 112, y: 385, title: ['USER'], icon: 'user' },
        watch: { x: 512, y: 130, title: ['WATCH APP'], icon: 'watch', titleBelow: 82 },
        db: { x: 907, y: 378, title: ['SECURE DATABASE', '+ NOVEL AI MODEL'], icon: 'cloud' },
        therapist: { x: 1313, y: 385, title: ['REGISTERED THERAPISTS'], icon: 'therapist' },
        phone: { x: 512, y: 618, title: ['PHONE APP'], icon: 'phone', titleBelow: 80 },
      }
      // kind: data (user → system), ai (model output), training (therapists)
      const EDGES = [
        {
          kind: 'data',
          points: [[112, 292], [112, 128], [452, 128]],
          label: { x: 138, y: 164, anchor: 'start', head: 'Contextual user data:', items: ['biometrics', 'voice entries', 'movement', 'surrounding noise'] },
        },
        {
          kind: 'ai',
          points: [[907, 302], [907, 128], [572, 128]],
          label: { x: 883, y: 164, anchor: 'end', lines: ['Micro-reflection', 'prompt generation'] },
        },
        {
          kind: 'ai',
          points: [[502, 222], [502, 368], [192, 368]],
          label: { x: 476, y: 318, anchor: 'end', lines: ['Context-aware daily', 'micro-reflection prompts'] },
        },
        {
          kind: 'data',
          points: [[522, 222], [522, 368], [818, 368]],
          label: { x: 548, y: 336, anchor: 'start', lines: ['Contextual user data'] },
        },
        {
          kind: 'ai',
          points: [[502, 532], [502, 388], [192, 388]],
          label: { x: 476, y: 422, anchor: 'end', head: 'Interactive journal space:', items: ['daily entries', 'counterfactuals', 'behavior plans'] },
        },
        {
          kind: 'data',
          points: [[522, 532], [522, 388], [818, 388]],
          label: { x: 548, y: 422, anchor: 'start', lines: ['Activity user data'] },
        },
        {
          kind: 'data',
          points: [[112, 502], [112, 612], [448, 612]],
          label: { x: 138, y: 548, anchor: 'start', head: 'Activity user data:', items: ['touch & scroll interactions', 'content updates'] },
        },
        {
          kind: 'ai',
          points: [[907, 520], [907, 612], [576, 612]],
          label: { x: 883, y: 556, anchor: 'end', lines: ['Daily entries +', 'counterfactual', 'generation'] },
        },
        {
          kind: 'training',
          points: [[1232, 378], [998, 378]],
          label: { x: 1000, y: 314, anchor: 'start', head: 'Training data:', items: ['counterfactual generation', 'micro-reflection prompting'] },
        },
      ]

      // ---------- Options ----------
      const OPTIONS = [
        {
          id: 'outline',
          name: 'Outline',
          note: 'Closest to the original: same layout, ink strokes on paper.',
          stroke: 2.5,
          radius: 22,
          icon: 2.5,
          label: INK,
          labelSize: 15,
          titleSize: 14,
          titleWeight: 500,
          arrow: 'chevron',
        },
        {
          id: 'hairline',
          name: 'Hairline',
          note: 'Lighter and more editorial: thin strokes, grey labels, small tracked titles.',
          stroke: 1.25,
          radius: 28,
          icon: 1.5,
          label: STONE,
          labelSize: 14,
          titleSize: 12,
          titleWeight: 500,
          titleTrack: 0.08,
          arrow: 'triangle',
        },
        {
          id: 'discs',
          name: 'Discs',
          note: 'Each actor sits on a white disc with the site’s soft card shadow; lines are quieter.',
          stroke: 1.5,
          radius: 24,
          icon: 2,
          line: STONE_LIGHT,
          arrowColor: INK,
          label: INK,
          labelSize: 14,
          titleSize: 13,
          titleWeight: 500,
          arrow: 'triangle',
          disc: 64,
          dots: true,
        },
        {
          id: 'accent',
          name: 'Accent',
          note: 'Colour-coded flows: ink for user data, Unwind blue for AI output, dashed for training data.',
          stroke: 2,
          radius: 22,
          icon: 2,
          label: INK,
          labelSize: 14,
          titleSize: 13,
          titleWeight: 500,
          arrow: 'chevron',
          kinds: { data: { color: INK }, ai: { color: BLUE }, training: { color: STONE, dash: '6 7' } },
          legend: true,
        },
        {
          id: 'live',
          name: 'Live flow',
          note: 'Dotted lines that move in the direction data travels. Good for a scrolling case study.',
          stroke: 2.5,
          radius: 22,
          icon: 2,
          label: INK,
          labelSize: 14,
          titleSize: 13,
          titleWeight: 500,
          arrow: 'chevron',
          dash: '0.1 12',
          animate: true,
          kinds: { ai: { color: BLUE } },
        },
      ]

      // ---------- Drawing ----------
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

      /** Orthogonal polyline with rounded corners. */
      function path(points, r) {
        let d = `M${points[0][0]} ${points[0][1]}`
        for (let i = 1; i < points.length; i++) {
          const [x, y] = points[i]
          const next = points[i + 1]
          if (!next) {
            d += ` L${x} ${y}`
            break
          }
          const [px, py] = points[i - 1]
          const k = Math.min(r, Math.hypot(x - px, y - py) / 2, Math.hypot(next[0] - x, next[1] - y) / 2)
          const inX = x - Math.sign(x - px) * k
          const inY = y - Math.sign(y - py) * k
          const outX = x + Math.sign(next[0] - x) * k
          const outY = y + Math.sign(next[1] - y) * k
          d += ` L${inX} ${inY} Q${x} ${y} ${outX} ${outY}`
        }
        return d
      }

      function arrowHead(points, o, color, width) {
        const [x, y] = points[points.length - 1]
        const [px, py] = points[points.length - 2]
        const a = Math.atan2(y - py, x - px)
        const s = o.arrow === 'triangle' ? 7 + width * 1.5 : 7 + width * 2
        const p1 = [x - s * Math.cos(a - 0.6), y - s * Math.sin(a - 0.6)]
        const p2 = [x - s * Math.cos(a + 0.6), y - s * Math.sin(a + 0.6)]
        if (o.arrow === 'triangle') {
          return `<path d="M${x} ${y} L${p1} L${p2} Z" fill="${color}" />`
        }
        return `<path d="M${p1} L${x} ${y} L${p2}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" />`
      }

      function label(l, o) {
        const lh = o.labelSize * 1.3
        const out = []
        let y = l.y
        const text = (content, x, anchor, y) =>
          `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${o.labelSize}" fill="${o.label}">${content}</text>`
        if (l.lines) for (const line of l.lines) (out.push(text(esc(line), l.x, l.anchor, y)), (y += lh))
        if (l.head) {
          out.push(text(esc(l.head), l.x, l.anchor, y))
          y += lh
          // Bullets hang from the head's left edge (right-aligned heads keep their bullets on its left too).
          const width = Math.max(...[l.head, ...l.items].map((s) => s.length)) * o.labelSize * 0.5
          const left = l.anchor === 'end' ? l.x - width : l.x
          for (const item of l.items) {
            const size = o.labelSize
            const glyph = POINT_ICONS[item].node.map(([tag, attrs]) =>
              `<${tag} ${Object.entries(attrs).filter(([key]) => key !== 'key').map(([key, value]) => `${key}="${value}"`).join(' ')}/>`
            ).join('')
            out.push(`<g aria-label="${esc(item)}" transform="translate(${left + 8} ${y - size + 2}) scale(${size / 24})" fill="none" stroke="${o.label}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${glyph}</g>`)
            out.push(text(esc(item), left + size + 16, 'start', y))
            y += lh
          }
        }
        return out.join('')
      }


      function titleText(node, o) {
        const below = node.titleBelow ?? 104
        return node.title
          .map(
            (line, i) =>
              `<text x="${node.x}" y="${node.y + below + i * o.titleSize * 1.35}" text-anchor="middle" font-size="${o.titleSize}" font-weight="${o.titleWeight}" letter-spacing="${o.titleTrack ?? 0.04}em" fill="${INK}">${esc(line)}</text>`,
          )
          .join('')
      }

      function render(o) {
        const parts = []
        parts.push(`<defs><filter id="shadow-${o.id}" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.08"/></filter></defs>`)
        parts.push(`<rect width="${W}" height="${H}" fill="#f5f5f5" />`)
        if (o.animate) parts.push('<style>.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>')

        EDGES.forEach((e, index) => {
          const kind = o.kinds?.[e.kind] ?? {}
          const color = kind.color ?? o.line ?? INK
          const dash = o.presetDash ?? kind.dash ?? o.dash
          const cls = o.animate ? ' class="flow"' : ''
          parts.push(`<g class="edge" data-edge="${index}">`)
          parts.push(
            `<path class="edge__line" d="${path(e.points, o.radius)}" fill="none" stroke="${color}" stroke-width="${o.stroke}" stroke-linecap="round" stroke-linejoin="round"${dash ? ` stroke-dasharray="${dash}"` : ''}${cls} />`,
          )
          parts.push(arrowHead(e.points, o, kind.color ?? o.arrowColor ?? color, o.stroke))
          if (o.dots) parts.push(`<circle cx="${e.points[0][0]}" cy="${e.points[0][1]}" r="3.5" fill="${o.arrowColor ?? INK}" />`)
          parts.push(`<g class="edge__label">${label(e.label, o)}</g></g>`)
        })

        for (const [key, node] of Object.entries(NODES)) {
          parts.push(`<g class="node" data-node="${key}">`)
          if (o.story) parts.push(`<circle class="node__halo" cx="${node.x}" cy="${node.y}" r="78" fill="${BLUE}" />`)
          if (o.disc) parts.push(`<circle cx="${node.x}" cy="${node.y}" r="${o.disc}" fill="#fff" filter="url(#shadow-${o.id})" />`)
          const size = o.disc ? 112 : 142
          parts.push(`<image href="${assets[node.icon]}" x="${node.x - size / 2}" y="${node.y - size / 2}" width="${size}" height="${size}" preserveAspectRatio="xMidYMid meet"/>`)
          parts.push(titleText(node, o), '</g>')
        }
        if (o.story) parts.push('<g class="story-flow"></g>')

        if (o.legend) {
          const items = [
            ['User data', INK, ''],
            ['AI output', BLUE, ''],
            ['Training data', STONE, '6 7'],
          ]
          items.forEach(([name, color, dash], i) => {
            const x = 1000 + i * 140
            parts.push(`<path d="M${x} 90 h28" stroke="${color}" stroke-width="${o.stroke}" stroke-linecap="round"${dash ? ` stroke-dasharray="${dash}"` : ''} />`)
            parts.push(`<text x="${x + 38}" y="95" font-size="13" fill="${STONE}">${name}</text>`)
          })
        }

        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Beatrice, system-ui, sans-serif" letter-spacing="-0.01em" role="img" aria-label="Unwind system design — ${o.name}">${parts.join('')}</svg>`
      }

      // ---------- Animated walkthrough (Hairline treatment) ----------
      // Edge indices follow EDGES: 0 user→watch, 1 AI→watch, 2 watch→user, 3 watch→AI,
      // 4 phone→user, 5 phone→AI, 6 user→phone, 7 AI→phone, 8 therapists→AI.
      const STORY = [
        { title: 'You live your day', text: 'Your watch picks up body signals, voice, movement and noise. Your phone records how you use the app.', edges: [0, 6], nodes: ['user', 'watch', 'phone'] },
        { title: 'Context goes to the model', text: 'Both apps send that context to the secure database and AI model.', edges: [3, 5], nodes: ['watch', 'phone', 'db'] },
        { title: 'Therapists train it', text: 'Registered therapists teach the model how to write counterfactuals and reflection prompts.', edges: [8], nodes: ['therapist', 'db'] },
        { title: 'The model responds', text: 'It sends a timely prompt to your watch, and entries and counterfactuals to your phone.', edges: [1, 7], nodes: ['db', 'watch', 'phone'] },
        { title: 'You reflect', text: 'A short prompt on your wrist; a journal with what-ifs and behavior plans on your phone.', edges: [2, 4], nodes: ['watch', 'phone', 'user'] },
        { title: 'The loop repeats', text: 'Each reflection becomes new context, so the next prompt fits you better.', edges: [0, 6, 3, 5, 8, 1, 7, 2, 4], nodes: Object.keys(NODES) },
      ]
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches
      const ease = (x) => 0.5 - Math.cos(Math.PI * Math.min(1, Math.max(0, x))) / 2
      // Flow feels. All follow the case study's rule: ink stays still, only Unwind blue moves.
      const FEELS = {
        breathe: { name: 'Breathe', note: 'Lines draw in slowly, then glow in and out like a breath.', step: 5600, draw: 1600 },
        ripple: { name: 'Ripple', note: 'One soft dot crosses each line; a ring spreads where it lands.', step: 5000, draw: 1200 },
        tide: { name: 'Tide', note: 'Fine blue dots drift slowly along the line, like the Live flow option.', step: 5400, draw: 1400 },
        comet: { name: 'Soft comet', note: 'A blurred streak of light glides along each line.', step: 4800, draw: 1000 },
        ink: { name: 'Ink in', note: 'The line draws once and holds. Stillest; the caption does the work.', step: 5200, draw: 2000 },
        pulse: { name: 'Pulse dots', note: 'Three dots chase along each line. The first version.', step: 4200, draw: 900 },
      }

      function mountStory() {
        const base = OPTIONS.find((o) => o.id === 'hairline')
        const o = { ...base, id: 'story', story: true }
        const section = document.createElement('section')
        section.className = 'option story'
        section.id = 'story'
        section.innerHTML = `
          <div class="option__head">
            <h2>Animated — how it works</h2>
            <p class="story__feelnote"></p>
            <label>Feel <select data-act="feel" aria-label="Flow feel">${Object.entries(FEELS).map(([k, f]) => `<option value="${k}">${f.name}</option>`).join('')}</select></label>
            <button type="button" data-act="play">Pause</button>
          </div>
          <div class="story__caption" aria-live="polite">
            <span class="story__num"></span>
            <div><strong class="story__title"></strong><p class="story__text"></p></div>
          </div>
          ${render(o)}
          <nav class="story__steps">${STORY.map((s, i) => `<button type="button" data-step="${i}"><span>${String(i + 1).padStart(2, '0')}</span>${s.title}</button>`).join('')}</nav>`
        root.append(section)

        const svg = section.querySelector('svg')
        const layer = svg.querySelector('.story-flow')
        const lines = [...svg.querySelectorAll('.edge__line')]
        const SVGNS = 'http://www.w3.org/2000/svg'
        svg.insertAdjacentHTML('afterbegin', '<defs><filter id="story-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter></defs>')
        let step = 0, playing = !reduceMotion, started = 0, flows = [], feel = FEELS.breathe
        const el = (tag, attrs) => {
          const n = document.createElementNS(SVGNS, tag)
          for (const k in attrs) n.setAttribute(k, attrs[k])
          layer.append(n)
          return n
        }

        function show(i) {
          step = (i + STORY.length) % STORY.length
          const s = STORY[step]
          section.querySelector('.story__num').textContent = String(step + 1).padStart(2, '0')
          section.querySelector('.story__title').textContent = s.title
          section.querySelector('.story__text').textContent = s.text
          section.querySelectorAll('[data-step]').forEach((b) => b.setAttribute('aria-current', String(+b.dataset.step === step)))
          svg.querySelectorAll('.edge').forEach((g) => g.classList.toggle('is-on', s.edges.includes(+g.dataset.edge)))
          svg.querySelectorAll('.node').forEach((g) => g.classList.toggle('is-on', s.nodes.includes(g.dataset.node)))
          layer.innerHTML = ''
          flows = s.edges.map((e, k) => {
            const d = lines[e].getAttribute('d')
            const trace = el('path', { class: 'trace', d, pathLength: 1 })
            const len = trace.getTotalLength()
            const f = { trace, len, k, end: trace.getPointAtLength(len) }
            if (feel === FEELS.pulse) f.dots = [0, 1, 2].map(() => el('circle', { r: 4.5, class: 'pulse' }))
            if (feel === FEELS.ripple) {
              f.ring = el('circle', { class: 'ring', cx: f.end.x, cy: f.end.y, r: 4 })
              f.dot = el('circle', { r: 5, class: 'pulse' })
            }
            if (feel === FEELS.tide) f.tide = el('path', { class: 'tide', d })
            if (feel === FEELS.comet) {
              f.glow = el('path', { class: 'comet comet--glow', d, filter: 'url(#story-soft)' })
              f.head = el('path', { class: 'comet', d })
            }
            return f
          })
          started = performance.now()
        }

        function frame(now) {
          const t = now - started
          const drawn = ease(t / feel.draw)
          const after = t - feel.draw
          const live = !reduceMotion && after > 0
          for (const f of flows) {
            f.trace.style.strokeDashoffset = String(1 - drawn)
            if (feel === FEELS.breathe) {
              f.trace.style.opacity = live ? String(0.55 + 0.45 * Math.cos((after / 2600) * 2 * Math.PI)) : '1'
            } else if (feel === FEELS.pulse) {
              f.dots.forEach((dot, k) => {
                const phase = (after - k * 500) / 1500
                const on = live && phase >= 0
                dot.style.opacity = on ? String(Math.sin(Math.PI * (phase % 1))) : '0'
                if (on) { const p = f.trace.getPointAtLength((phase % 1) * f.len); dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y) }
              })
            } else if (feel === FEELS.ripple) {
              // 2.4s cycle: 1.6s glide (eased), then the ring spreads at the arrow.
              const c = live ? ((after - f.k * 300) / 2400) : -1
              const glide = c >= 0 ? (c % 1) / (1.6 / 2.4) : -1
              const on = glide >= 0 && glide <= 1
              f.dot.style.opacity = on ? String(Math.min(1, glide * 6, (1 - glide) * 6)) : '0'
              if (on) { const p = f.trace.getPointAtLength(ease(glide) * f.len); f.dot.setAttribute('cx', p.x); f.dot.setAttribute('cy', p.y) }
              const r = glide > 1 ? (glide - 1) / 0.5 : 0
              f.ring.setAttribute('r', String(4 + 22 * ease(r)))
              f.ring.style.opacity = r > 0 ? String(0.6 * (1 - r)) : '0'
            } else if (feel === FEELS.tide) {
              f.trace.style.opacity = live ? '0.25' : '1'
              f.tide.style.opacity = live ? String(Math.min(1, after / 600)) : '0'
              f.tide.style.strokeDashoffset = String(-after * 0.014)
            } else if (feel === FEELS.comet) {
              const seg = 70, travel = f.len + seg
              const pos = live ? ((after + f.k * 400) / 2200) % 1 : 0
              const off = String(seg - pos * travel)
              for (const p of [f.glow, f.head]) {
                p.style.strokeDasharray = `${seg} ${f.len + seg}`
                p.style.strokeDashoffset = off
                p.style.opacity = live ? '' : '0'
              }
              f.trace.style.opacity = live ? '0.35' : '1'
            }
          }
          if (playing && t > feel.step) show(step + 1)
          requestAnimationFrame(frame)
        }

        const feelSelect = section.querySelector('[data-act="feel"]')
        const setFeel = (key) => {
          feel = FEELS[key]
          section.dataset.feel = key
          section.querySelector('.story__feelnote').textContent = feel.note
          show(step)
        }
        feelSelect.addEventListener('change', () => setFeel(feelSelect.value))

        const playBtn = section.querySelector('[data-act="play"]')
        const setPlaying = (v) => { playing = v; playBtn.textContent = v ? 'Pause' : 'Play' }
        playBtn.addEventListener('click', () => { setPlaying(!playing); if (playing) started = performance.now() })
        section.querySelector('.story__steps').addEventListener('click', (e) => {
          const b = e.target.closest('[data-step]')
          if (b) { setPlaying(false); show(+b.dataset.step) }
        })
        setPlaying(playing)
        setFeel('breathe')
        requestAnimationFrame(frame)
      }

      const root = document.getElementById('options')
      mountStory()
      OPTIONS.forEach((o, i) => {
        const section = document.createElement('section')
        section.className = 'option'
        section.id = o.id
        section.innerHTML = `
          <div class="option__head">
            <h2>${String(i + 1).padStart(2, '0')} — ${o.name}</h2>
            <p>${o.note}</p>
            <label>Arrows <select aria-label="Arrow style for ${o.name}">${Object.entries(ARROWS).map(([value, preset]) => `<option value="${value}">${preset.name}</option>`).join('')}</select></label>
            <button type="button">Download SVG</button>
          </div>
          ${render(o)}`
        section.querySelector('select').addEventListener('change', (event) => {
          const preset = ARROWS[event.target.value]
          const next = { ...o, ...preset, name: o.name, presetDash: preset.dash }
          section.querySelector('svg').outerHTML = render(next)
        })
        section.querySelector('button').addEventListener('click', () => {
          const blob = new Blob([section.querySelector('svg').outerHTML], { type: 'image/svg+xml' })
          const a = document.createElement('a')
          a.href = URL.createObjectURL(blob)
          a.download = `unwind-system-design-${o.id}-${section.querySelector('select').value}.svg`
          a.click()
          URL.revokeObjectURL(a.href)
        })
        root.append(section)
      })
    </script>
  </body>
</html>
