<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contribution grass — creature encounter</title>
<style>
  body { min-height: 100svh; margin: 0; display: grid; place-items: center; }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 48px 24px 96px; }

  /* Same pieces as ContributionGraph.css. */
  .cg__graph { position: relative; display: grid; gap: 6px; }
  .cg__labels { position: relative; height: 10px; }
  .cg__labels span { position: absolute; top: 0; white-space: nowrap; font-size: 10px; line-height: 1; color: var(--stone-600); }
  .cg__stage { position: relative; }
  .cg__grass { display: block; width: 100%; height: 100%; cursor: crosshair; }
  .cg__logo { display: block; width: 28px; height: 28px; margin-top: 24px; color: #fff; opacity: 0.5; }

  .gc-paused {
    position: absolute; top: 10px; left: 50%; translate: -50% 0; pointer-events: none;
    padding: 4px 10px; border-radius: 999px; background: rgb(0 0 0 / 0.6); color: #fff;
    font: 600 11px/1.2 var(--font); letter-spacing: 0.04em;
  }
  .gc-hint { font: 12px/1.3 var(--font); color: var(--stone-600); }
</style>
</head>
<body>
<main>
  <section class="cg__graph" aria-label="GitHub contributions">
    <div class="cg__labels" aria-hidden="true"></div>
    <div class="cg__stage">
      <canvas class="cg__grass"></canvas>
      <div class="gc-exclaim" data-style="bubble" aria-hidden="true"><span class="gc-exclaim__mark">!</span></div>
      <div class="gc-paused" role="status" hidden>Paused · Space to play</div>
    </div>
  </section>
  <svg class="cg__logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
  <p class="gc-hint">Hover the tallest patch to startle it. Space pauses and plays.</p>
</main>
<div id="gc-dials"></div>
<script type="module" src="/src/features/grassCreature/grassCreatureLab.ts"></script>
</body>
</html>
