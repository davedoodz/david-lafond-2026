<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Filo card · light palettes with glass tiles</title>
<style>
  :root { --page: #f5f5f4; --ink: #1b1a18; --muted: #77716a; --blur: 14px; --glass: 0.32; --edge: 0.55; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 "Beatrice", system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 40px 48px 8px; display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  header p { margin: 6px 0 0; color: var(--muted); max-width: 56ch; }
  .controls { display: flex; gap: 20px; flex-wrap: wrap; }
  .controls label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .controls output { color: var(--ink); font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 40px 32px; padding: 32px 48px 72px; }
  figure { margin: 0; }
  figcaption { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; }
  figcaption b { font-weight: 500; }
  figcaption span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .swatches { display: flex; gap: 4px; margin-top: 6px; }
  .swatches i { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.08); }

  /* The card: a soft colour field (two drifting blobs) so the glass has something to refract. */
  .card { position: relative; aspect-ratio: 16 / 9.1; border-radius: 22px; overflow: hidden; background: var(--bg); box-shadow: 0 24px 60px rgb(40 30 20 / 0.12); isolation: isolate; }
  .blob { position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; filter: blur(40px); opacity: 0.9; animation: drift 18s ease-in-out infinite alternate; }
  .blob--a { background: var(--blob-a); left: -15%; top: -25%; }
  .blob--b { background: var(--blob-b); right: -20%; bottom: -35%; animation-delay: -9s; }
  @keyframes drift { to { translate: 12% 10%; } }

  /* Same geometry as the live FiloCard: a card-sized wall, rotated -9° and zoomed 1.25× about its centre. */
  .card { container-type: size; }
  .wall { position: absolute; inset: 0; transform-origin: 50% 50%; }

  .tile {
    position: absolute; left: 0; top: 0; border-radius: var(--tile-radius, 16px); will-change: transform;
    background: linear-gradient(160deg, rgb(255 255 255 / calc(var(--glass) + 0.12)), rgb(255 255 255 / var(--glass)));
    backdrop-filter: blur(var(--blur)) saturate(1.3);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(1.3);
    box-shadow:
      inset 0 1px 0 rgb(255 255 255 / var(--edge)),
      inset 0 0 0 1px rgb(255 255 255 / calc(var(--edge) * 0.55)),
      0 10px 24px rgb(60 45 30 / 0.08);
  }
  .sprite { position: absolute; inset: 0; background-repeat: no-repeat; background-size: 600% 600%; }

  .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, transparent 55%, var(--shade) 100%); }
  .title { position: absolute; left: 5.5%; right: 5.5%; bottom: 7%; margin: 0; font-size: clamp(14px, 3.4cqh, 20px); font-weight: 400; color: var(--title); text-shadow: var(--title-shadow, none); letter-spacing: -0.01em; }

  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Filo card · lighter palettes, glass tiles</h1>
    <p>Six options drawn from the Filo case-study photos (linen, stone, taupe, desk-plant sage, clay). Tiles are frosted glass over a soft colour field. The sliders change every card at once.</p>
  </div>
  <div class="controls">
    <label>Blur <output id="blurOut">14px</output><input id="blur" type="range" min="0" max="40" value="14" /></label>
    <label>Glass fill <output id="glassOut">0.32</output><input id="glass" type="range" min="0" max="0.9" step="0.01" value="0.32" /></label>
    <label>Edge light <output id="edgeOut">0.55</output><input id="edge" type="range" min="0" max="1" step="0.01" value="0.55" /></label>
  </div>
</header>
<main class="grid" id="grid"></main>

<script>
const PALETTES = [
  { name: '1 · Linen glass', note: 'Warm linen field, taupe glow', bg: '#ECE6DC', a: '#D6C7B4', b: '#C3B19C', shade: 'rgb(90 74 58 / 0.42)', title: '#FFFFFF', titleShadow: '0 0 14px rgb(60 45 30 / 0.35)' },
  { name: '2 · Stone mist', note: 'Cool greige, closest to the swatch stacks', bg: '#E7E5E1', a: '#CFCAC2', b: '#B9B2A8', shade: 'rgb(70 64 58 / 0.4)', title: '#FFFFFF', titleShadow: '0 0 14px rgb(40 36 32 / 0.35)' },
  { name: '3 · Oat & sage', note: 'Linen with the desk plant’s sage', bg: '#ECE8DE', a: '#C9D0BE', b: '#D8CBB8', shade: 'rgb(70 78 62 / 0.4)', title: '#FFFFFF', titleShadow: '0 0 14px rgb(40 48 36 / 0.35)' },
  { name: '4 · Clay paper', note: 'Warmer, picks up the orange pieces', bg: '#EFE6DC', a: '#E2C6AE', b: '#CDB8A4', shade: 'rgb(110 80 58 / 0.4)', title: '#FFFFFF', titleShadow: '0 0 14px rgb(80 50 30 / 0.35)' },
  { name: '5 · Paper white', note: 'Lightest; dark title, no white glow', bg: '#F4F2EE', a: '#E3DED6', b: '#D7D0C6', shade: 'rgb(244 242 238 / 0.85)', title: '#1B1A18' },
  { name: '6 · Fog & charcoal', note: 'Light field, charcoal accents from the desk', bg: '#E9E8E6', a: '#D2CFCA', b: '#8C857D', shade: 'rgb(40 38 36 / 0.45)', title: '#FFFFFF', titleShadow: '0 0 14px rgb(20 18 16 / 0.35)' },
]
const SPRITES = ['balenciaga-ephea-mycelium-coat-fw2022','nike-partners-with-pinatex-for-happy-pineapple-plant-based-sneaker-collection','stella-mccartney-x-veuve-clicquot-vegea-frayme-grape-waste-woven-bag','allbirds-wool-runners','reishi','zara-pinatex-sandal','xtep-pla-windbreaker','yuima-nakazato-couture-with-brewed-protein','stella-mccartney-mylo-bustier-and-trousers-2021','zara-pinatex-bag','northface','coprinus','ferragamo-orange-fiber-collection-2017','osman-yousefzada-ss22-tencel-luxe','christian-siriano-ss2025-circ-lyocell','slk-orangefiber-tieorange-fiber-collection-e-marinalla','orange-fiber-x-h-m-conscious-exclusive-collection-2019']
  .map((n) => `url(/work/filo/sprites/${n}-spritesheet.webp)`)
// Live FiloCard defaults (src/components/FiloCard.tsx): 3 rails × 9 tiles, tile = 32% of card height,
// gap 12% of a tile, radius 10%, tilt -9°, zoom 1.25, 0.375 tiles/s with rails ×1, ×1.5, ×0.75, 4.5 fps spin.
const LIVE = { speed: 0.375, spin: 4.5, tilt: -9, zoom: 1.25, tile: 0.32, gap: 0.12, tileRadius: 0.1 }
const ROWS = 3, PER_ROW = 9, RAIL_SPEED = [1, 1.5, 0.75]
const mod = (a, n) => ((a % n) + n) % n

const grid = document.getElementById('grid')
const walls = []
PALETTES.forEach((p, pi) => {
  const fig = document.createElement('figure')
  fig.innerHTML = `
    <div class="card" style="--bg:${p.bg};--blob-a:${p.a};--blob-b:${p.b};--shade:${p.shade};--title:${p.title};${p.titleShadow ? `--title-shadow:${p.titleShadow}` : ''}">
      <span class="blob blob--a"></span><span class="blob blob--b"></span>
      <div class="wall"></div>
      <span class="shade"></span>
      <p class="title">Filo — Software for Taking New Materials from Sample to Production</p>
    </div>
    <figcaption><div><b>${p.name}</b><div class="swatches">${[p.bg, p.a, p.b].map((c) => `<i style="background:${c}"></i>`).join('')}</div></div><span>${p.note}<br>${p.bg} · ${p.a} · ${p.b}</span></figcaption>`
  const wall = fig.querySelector('.wall')
  const tiles = []
  for (let i = 0; i < ROWS * PER_ROW; i++) {
    const el = document.createElement('div')
    el.className = 'tile'
    const sprite = document.createElement('div')
    sprite.className = 'sprite'
    el.append(sprite)
    wall.append(el)
    tiles.push({ el, sprite, x: null })
  }
  walls.push({ card: fig.querySelector('.card'), wall, tiles, next: pi * 5 })
  grid.append(fig)
})

// Same motion as the live card: rails 0 and 2 slide left, rail 1 right; a tile takes the next product
// each time it wraps around off-card, so the wall keeps cycling through all 17. Time only clamps on long
// pauses (tab switch), so six glass cards rendering slower than 20 fps still move at the live speed.
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
let t = 0, last = 0
const render = () => {
  for (const w of walls) {
    const h = w.card.clientHeight
    const tile = h * LIVE.tile, slot = tile * (1 + LIVE.gap), span = slot * PER_ROW
    w.wall.style.transform = `rotate(${LIVE.tilt}deg) scale(${LIVE.zoom})`
    w.wall.style.setProperty('--tile-radius', `${tile * LIVE.tileRadius}px`)
    w.tiles.forEach((tl, i) => {
      const row = Math.floor(i / PER_ROW), dir = row % 2 ? 1 : -1
      const x = mod((i % PER_ROW) * slot + dir * t * LIVE.speed * RAIL_SPEED[row] * slot, span) - slot
      const y = h / 2 + (row - 1) * slot - tile / 2
      if (tl.x === null || Math.abs(x - tl.x) > span / 2) tl.sprite.style.backgroundImage = SPRITES[w.next++ % SPRITES.length]
      tl.x = x
      const f = mod(Math.floor(t * LIVE.spin + i * 7), 36)
      tl.el.style.width = tl.el.style.height = `${tile}px`
      tl.el.style.transform = `translate3d(${x}px, ${y}px, 0)`
      tl.sprite.style.backgroundPosition = `${(f % 6) * 20}% ${Math.floor(f / 6) * 20}%`
    })
  }
}
const tick = (now) => {
  if (last) t += Math.min(now - last, 250) / 1000
  last = now
  render()
  requestAnimationFrame(tick)
}
render()
if (!reduced) requestAnimationFrame(tick)
addEventListener('resize', render)

for (const [id, unit] of [['blur', 'px'], ['glass', ''], ['edge', '']]) {
  const input = document.getElementById(id), out = document.getElementById(id + 'Out')
  input.addEventListener('input', () => { document.documentElement.style.setProperty('--' + id, input.value + unit); out.textContent = input.value + unit })
}
</script>
</body>
</html>
