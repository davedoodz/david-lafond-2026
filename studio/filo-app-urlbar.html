<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Studio · Filo prototype with a browser address bar</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; font: 14px/1.5 system-ui, sans-serif; color: #232323; }
  main { width: min(1000px, 92vw); }
  .frame { aspect-ratio: 1536 / 1024; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px #e8e8e8, 0 24px 60px -24px rgba(0,0,0,.18); }
  .frame iframe { display: block; width: 100%; height: 100%; border: 0; }
  ol { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; color: #6f6f71; }
  ol b { display: inline-block; min-width: 290px; font-weight: 500; color: #141414; font-family: ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="frame"><iframe id="flow" src="/work/filo/filo-app-flow.html" title="Filo prototype"></iframe></div>
  <ol>
    <li><b>filo.app</b> Public site: the loop opens here, then signs in</li>
    <li><b>portal.filo.app</b> Materials list, upload, extraction</li>
    <li><b>portal.filo.app/materials/BC-001</b> Review and publish the material record</li>
  </ol>
</main>
<script type="module">
/* The address bar is now built into the prototype (public/work/filo/filo-app-flow/player.js); this page
   only frames it and starts playback. */
const frame = document.getElementById('flow')
addEventListener('message', ({ source, data }) => {
  if (source === frame.contentWindow && data?.filoAppFlow === 'ready') frame.contentWindow.postMessage({ filoAppFlow: 'play' }, location.origin)
})
</script>
</body>
</html>
