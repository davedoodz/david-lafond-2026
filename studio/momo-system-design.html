<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Momo system design — options</title>
    <style>
      @font-face {
        font-family: 'Beatrice';
        src: url('/fonts/Beatrice-Regular.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Beatrice';
        src: url('/fonts/Beatrice-Medium.woff2') format('woff2');
        font-weight: 500;
      }
      :root {
        --ink-900: #171717;
        --stone-600: #6f6b68;
        --stone-400: #a6a09c;
        --paper: #f5f5f5;
        --momo: #53bffe;
        --font: 'Beatrice', system-ui, -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink-900);
        font-family: var(--font);
        letter-spacing: -0.02em;
      }
      header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 56px 44px 8px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 40px;
        font-weight: 400;
        letter-spacing: -0.04em;
      }
      header p {
        margin: 0;
        color: var(--stone-600);
        font-size: 16px;
        max-width: 640px;
        line-height: 1.45;
      }
      .option {
        max-width: 1200px;
        margin: 0 auto;
        padding: 48px 44px 24px;
      }
      @media (max-width: 600px) {
        header, .option { padding-inline: 12px; }
      }
      .option__head {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 16px;
      }
      .option__head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .option__head p {
        margin: 0;
        color: var(--stone-600);
        font-size: 14px;
        flex: 1;
      }
      .option__head button {
        font: inherit;
        font-size: 13px;
        color: var(--ink-900);
        background: none;
        border: 1px solid var(--stone-400);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .option__head button:hover {
        border-color: var(--ink-900);
      }
      /* The whole figure always fits the screen: width is capped so its height never exceeds the viewport. */
      svg {
        display: block;
        width: min(100%, calc((100svh - 24px) * var(--ar, 1.5)));
        margin-inline: auto;
        height: auto;
      }
      .flow {
        animation: flow 1.6s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -24;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow {
          animation: none;
        }
      }
      .option__head { flex-wrap: wrap; }
      .option__head label { font-size: 13px; }
      select { font: inherit; padding: 6px 10px; border: 1px solid var(--stone-400); border-radius: 8px; background: white; }
    </style>
  </head>
  <body>
    <header>
      <h1>Momo system design</h1>
      <p>
        Five treatments with blue illustrations and Lucide point icons. Choose an arrow preset per diagram; SVG downloads include the selected style and embedded illustrations.
      </p>
    </header>
    <main id="options"></main>

    <script type="module">
      import { mountMomoSystem } from '/src/features/momoSystem/mountMomoSystem.js'
      await mountMomoSystem(document.getElementById('options'), { mode: 'studio' })
    </script>
  </body>
</html>
